<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Tiếng Trung</title>
    <style>
        /* CSS để nhúng font Simsun */
        @font-face {
            font-family: 'Simsun';
            src: url(https://fonts.gstatic.com/s/simsun/v18/K9-BZD0b9T8xcP0Q.woff2) format('woff2');
            unicode-range: U+4E00-9FFF; /* Phạm vi cho ký tự Hán */
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .scene {
            width: 100%;
            height: 300px;
            perspective: 600px;
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            transition: 
                transform 0.6s, 
                opacity 0.3s, 
                left 0.4s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- HIỆU ỨNG TRƯỢT --- */
        .card.slide-next-out {
            transform: translateX(-100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card.slide-prev-out {
            transform: translateX(100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #ffffff;
        }

        /* YÊU CẦU: Mặt trước chữ Hán, font Simsun, màu đen, ở giữa */
        .card__face--front {
            font-family: 'Simsun', sans-serif; 
            font-size: 80px;
            color: #000000; /* Chữ màu đen */
        }

        .card__face--back {
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center; 
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
        }
        
        .back-content p {
            font-size: 1.3rem;
            margin: 8px 0;
            width: 100%;
            text-align: center; 
            font-weight: 500;
        }
        
        .back-content .pinyin { color: #e67e22; font-weight: bold; font-size: 1.6rem; } /* Màu cam */
        .back-content .hanviet { color: #8e44ad; } /* Màu tím */
        .back-content .nghia { color: #1f506b; font-style: italic; } /* Màu xanh đậm (thay vì #27ae60) */
        .back-content .vidu-han { color: #000000; font-family: 'Simsun', sans-serif; margin-top: 15px; font-size: 1.5rem; } /* Chữ Hán đen */
        .back-content .dichnghia { color: #000000; font-style: italic; font-size: 1rem; } /* Chữ đen */


        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-button {
            padding: 10px 20px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 0 5px;
        }

        .nav-button:hover {
            background-color: #2980b9;
        }
        
        #counter {
            font-size: 1.1rem;
            font-weight: bold;
            color: #7f8c8d;
            flex-grow: 1;
            text-align: center;
        }
        
        .jump-control {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        #jump-input {
            width: 60px;
            padding: 8px;
            border: 2px solid #3498db;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
        }
        
        .jump-button {
            background-color: #e74c3c; 
        }
        
        .jump-button:hover {
            background-color: #c0392b;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard Tiếng Trung</h1>
        <div class="scene">
            <div id="flashcard-container"></div>
        </div>
        <div class="navigation">
            <button class="nav-button" id="prev-btn">Trước</button>
            <span id="counter"></span>
            <button class="nav-button" id="next-btn">Sau</button>
        </div>
        
        <div class="jump-control">
            <input type="number" id="jump-input" min="1" max="30" placeholder="#">
            <button class="nav-button jump-button" id="jump-btn">Nhảy đến thẻ số</button>
        </div>
    </div>

    <script>
        // 30 từ vựng Hán ngữ giản thể được lấy từ shengci.txt
        const cardData = [
  { hanzi: '现在', pinyin: 'xiànzài', hanviet: 'Hiện tại', nghia: 'Bây giờ, hiện tại', vidu: '现在是下午三点。', dichnghia: 'Bây giờ là 3 giờ chiều.' },
  { hanzi: '跟', pinyin: 'gēn', hanviet: 'Cân/Ngân', nghia: 'Với, cùng', vidu: '我想跟你一起去。', dichnghia: 'Tôi muốn cùng bạn đi.' },
  { hanzi: '一起', pinyin: 'yīqǐ', hanviet: 'Nhất khởi', nghia: 'Cùng nhau', vidu: '我们一起学习吧。', dichnghia: 'Chúng ta cùng nhau học nhé.' },
  { hanzi: '咱们', pinyin: 'zánmen', hanviet: 'Chẩm môn', nghia: 'Chúng ta (bao gồm người nói và người nghe)', vidu: '咱们明天见。', dichnghia: 'Chúng ta gặp nhau ngày mai nhé.' },
  { hanzi: '借', pinyin: 'jiè', hanviet: 'Tá', nghia: 'Mượn, cho mượn', vidu: '我可以借你的笔吗？', dichnghia: 'Tôi có thể mượn bút của bạn được không?' },
  { hanzi: '常常', pinyin: 'chángcháng', hanviet: 'Thường thường', nghia: 'Thường xuyên', vidu: '她常常帮助别人。', dichnghia: 'Cô ấy thường xuyên giúp đỡ người khác.' },
  { hanzi: '有时候', pinyin: 'yǒushíhou', hanviet: 'Hữu thời hậu', nghia: 'Có lúc, đôi khi', vidu: '我有时候会感到累。', dichnghia: 'Đôi khi tôi sẽ cảm thấy mệt mỏi.' },
  { hanzi: '总是', pinyin: 'zǒngshì', hanviet: 'Tổng thị', nghia: 'Luôn luôn, cứ luôn', vidu: '他总是很准时。', dichnghia: 'Anh ấy luôn luôn rất đúng giờ.' },
  { hanzi: '安静', pinyin: 'ānjìng', hanviet: 'An tĩnh', nghia: 'Yên tĩnh, yên lặng', vidu: '图书馆里很安静。', dichnghia: 'Trong thư viện rất yên tĩnh.' },
  { hanzi: '热闹', pinyin: 'rènào', hanviet: 'Nhiệt náo', nghia: 'Náo nhiệt, ồn ào', vidu: '春节的时候很热闹。', dichnghia: 'Khi Tết đến rất náo nhiệt.' },
  { hanzi: '休息', pinyin: 'xiūxi', hanviet: 'Hưu tức', nghia: 'Nghỉ ngơi', vidu: '工作累了就休息一下。', dichnghia: 'Làm việc mệt rồi thì nghỉ ngơi một chút.' },
  { hanzi: '地方', pinyin: 'dìfang', hanviet: 'Địa phương', nghia: 'Địa phương, nơi, chỗ', vidu: '这个地方很漂亮。', dichnghia: 'Nơi này rất đẹp.' },
  { hanzi: '上网', pinyin: 'shàng wǎng', hanviet: 'Thượng võng', nghia: 'Lên mạng, lướt web', vidu: '我每天都上网查资料。', dichnghia: 'Tôi lên mạng tra cứu tài liệu mỗi ngày.' },
  { hanzi: '网吧', pinyin: 'wǎngbā', hanviet: 'Võng ba', nghia: 'Quán net, tiệm internet', vidu: '很多年轻人喜欢去网吧。', dichnghia: 'Rất nhiều người trẻ thích đi quán net.' },
  { hanzi: '脸书', pinyin: 'Liǎnshū', hanviet: 'Kiểm thư', nghia: 'Facebook', vidu: '他在脸书上分享照片。', dichnghia: 'Anh ấy chia sẻ ảnh trên Facebook.' },
  { hanzi: '微信', pinyin: 'Wēixìn', hanviet: 'Vi tín', nghia: 'Wechat', vidu: '请加我的微信。', dichnghia: 'Xin hãy thêm Wechat của tôi.' },
  { hanzi: '视频', pinyin: 'shìpín', hanviet: 'Thị tần', nghia: 'Video, đoạn phim', vidu: '我们来看这个视频。', dichnghia: 'Chúng ta hãy xem đoạn video này.' },
  { hanzi: '查资料', pinyin: 'chá zīliào', hanviet: 'Tra tư liệu', nghia: 'Tra cứu tài liệu/dữ liệu', vidu: '你需要去图书馆查资料。', dichnghia: 'Bạn cần đến thư viện tra cứu tài liệu.' },
  { hanzi: '收发', pinyin: 'shōufā', hanviet: 'Thu phát', nghia: 'Nhận và gửi (thư, email)', vidu: '秘书负责收发文件。', dichnghia: 'Thư ký phụ trách nhận và gửi văn kiện.' },
  { hanzi: '伊妹儿', pinyin: 'yīmèi\'ér', hanviet: 'Y muội nhi', nghia: 'Email (phiên âm)', vidu: '请把报告发到我的伊妹儿。', dichnghia: 'Xin hãy gửi báo cáo đến email của tôi.' },
  { hanzi: '邮件', pinyin: 'yóujiàn', hanviet: 'Bưu kiện', nghia: 'Thư, email', vidu: '我每天都检查新邮件。', dichnghia: 'Tôi kiểm tra thư mới mỗi ngày.' },
  { hanzi: '网购', pinyin: 'wǎnggòu', hanviet: 'Võng cấu', nghia: 'Mua sắm trực tuyến', vidu: '她喜欢在家网购。', dichnghia: 'Cô ấy thích mua sắm trực tuyến tại nhà.' },
  { hanzi: '电影', pinyin: 'diànyǐng', hanviet: 'Điện ảnh', nghia: 'Phim điện ảnh', vidu: '这部电影很有意思。', dichnghia: 'Bộ phim này rất thú vị.' },
  { hanzi: '还是', pinyin: 'háishì', hanviet: 'Hoàn thị', nghia: 'Hay là, vẫn là (lựa chọn)', vidu: '你喝茶还是咖啡？', dichnghia: 'Bạn uống trà hay cà phê?' },
  { hanzi: '课文', pinyin: 'kèwén', hanviet: 'Khóa văn', nghia: 'Bài khóa, bài học', vidu: '请大家打开课文第二页。', dichnghia: 'Mời mọi người mở trang thứ hai của bài khóa.' },
  { hanzi: '生词', pinyin: 'shēngcí', hanviet: 'Sinh từ', nghia: 'Từ mới', vidu: '请记住这些生词。', dichnghia: 'Xin hãy nhớ những từ mới này.' },
  { hanzi: '练习', pinyin: 'liànxí', hanviet: 'Luyện tập', nghia: 'Bài tập, luyện tập', vidu: '做完练习才能玩。', dichnghia: 'Làm xong bài tập mới được chơi.' },
  { hanzi: '复习', pinyin: 'fùxí', hanviet: 'Phục tập', nghia: 'Ôn tập, ôn bài', vidu: '考试前要好好复习。', dichnghia: 'Trước khi thi phải ôn tập thật kỹ.' },
  { hanzi: '预习', pinyin: 'yùxí', hanviet: 'Dự tập', nghia: 'Chuẩn bị bài, xem trước bài', vidu: '明天上课前请预习。', dichnghia: 'Trước khi vào học ngày mai xin hãy xem trước bài.' },
  { hanzi: '作业', pinyin: 'zuòyè', hanviet: 'Tác nghiệp', nghia: 'Bài tập về nhà', vidu: '我忘了做今天的作业。', dichnghia: 'Tôi quên làm bài tập về nhà hôm nay.' },
  { hanzi: '电视剧', pinyin: 'diànshìjù', hanviet: 'Điện thị kịch', nghia: 'Phim truyền hình, phim bộ', vidu: '她喜欢看古装电视剧。', dichnghia: 'Cô ấy thích xem phim truyền hình cổ trang.' },
  { hanzi: '或者', pinyin: 'huòzhě', hanviet: 'Hoặc giả', nghia: 'Hoặc là, hay là (lựa chọn trong câu trần thuật)', vidu: '你可以打电话或者发邮件。', dichnghia: 'Bạn có thể gọi điện thoại hoặc gửi email.' }
];

        const flashcardContainer = document.getElementById('flashcard-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const jumpInput = document.getElementById('jump-input');
        const counter = document.getElementById('counter');

        let currentIndex = 0;
        let isTransitioning = false; 
        const totalCards = cardData.length;
        
        // Biến xử lý Vuốt (Swipe)
        let touchstartX = 0;
        let touchendX = 0;
        const SWIPE_THRESHOLD = 50; 
        
        jumpInput.max = totalCards;
        
        function renderCard(index) {
            const currentCard = cardData[index];
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            cardElement.id = 'flashcard-' + index;

            // Mặt trước: Chữ Hán, Simsun, Đen
            cardElement.innerHTML = `
                <div class="card__face card__face--front">${currentCard.hanzi}</div>
                <div class="card__face card__face--back">
                    <div class="back-content">
                        <p class="pinyin">${currentCard.pinyin}</p>
                        <p class="hanviet">${currentCard.hanviet}</p>
                        <p class="nghia">${currentCard.nghia}</p>
                        <p class="vidu-han">${currentCard.vidu}</p>
                        <p class="dichnghia">${currentCard.dichnghia}</p>
                    </div>
                </div>
            `;
            
            // Xử lý sự kiện lật thẻ
            cardElement.addEventListener('click', () => {
                if (!isTransitioning) {
                    cardElement.classList.toggle('is-flipped');
                }
            });

            // --- Logic Swipe ---
            cardElement.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, false);

            cardElement.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleGesture();
            }, false);
            
            return cardElement;
        }
        
        function updateDisplay() {
            counter.textContent = `${currentIndex + 1} / ${totalCards}`;
        }

        function changeCard(newIndex, direction) {
            if (isTransitioning || newIndex === currentIndex) {
                return;
            }

            if (newIndex < 0) {
                newIndex = totalCards - 1;
            } else if (newIndex >= totalCards) {
                newIndex = 0;
            }

            isTransitioning = true;
            const oldCard = document.getElementById('flashcard-' + currentIndex);
            const newCard = renderCard(newIndex);
            
            let slideDirection = direction;
            if (!slideDirection) {
                slideDirection = (newIndex > currentIndex || (currentIndex === totalCards - 1 && newIndex === 0)) ? 'next' : 'prev';
            }
            
            newCard.style.left = slideDirection === 'next' ? '100%' : '-100%';
            flashcardContainer.appendChild(newCard);
            
            if (oldCard) {
                oldCard.classList.add(slideDirection === 'next' ? 'slide-next-out' : 'slide-prev-out');
            }

            setTimeout(() => {
                newCard.style.left = '0';
            }, 50); 

            setTimeout(() => {
                if (oldCard) {
                    oldCard.remove();
                }
                currentIndex = newIndex;
                updateDisplay();
                isTransitioning = false;
            }, 400); 
        }
        
        function goToNextCard() {
            const newIndex = (currentIndex + 1) % totalCards;
            changeCard(newIndex, 'next');
        }

        function goToPrevCard() {
            const newIndex = (currentIndex - 1 + totalCards) % totalCards;
            changeCard(newIndex, 'prev');
        }
        
        function jumpToCard() {
            const inputValue = parseInt(jumpInput.value);
            
            if (isNaN(inputValue) || inputValue < 1 || inputValue > totalCards) {
                alert(`Lỗi: Vui lòng nhập số thẻ hợp lệ từ 1 đến ${totalCards}.`);
                jumpInput.value = "";
                return;
            }
            
            const newIndex = inputValue - 1;

            const direction = (newIndex > currentIndex) ? 'next' : 'prev';
            
            changeCard(newIndex, direction);

            jumpInput.value = "";
        }

        function handleGesture() {
            if (isTransitioning) return;
            const deltaX = touchendX - touchstartX;
            
            if (Math.abs(deltaX) > SWIPE_THRESHOLD) {
                if (deltaX < 0) {
                    goToNextCard();
                } else {
                    goToPrevCard();
                }
            }
        }

        prevBtn.addEventListener('click', goToPrevCard);
        nextBtn.addEventListener('click', goToNextCard);
        jumpBtn.addEventListener('click', jumpToCard);
        
        jumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                jumpToCard();
            }
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            flashcardContainer.appendChild(renderCard(currentIndex));
            updateDisplay();
        });

    </script>
</body>

</html>
