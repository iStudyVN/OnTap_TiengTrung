<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Tiếng Trung</title>
    <style>
        /* CSS để nhúng font Simsun */
        @font-face {
            font-family: 'Simsun';
            src: url(https://fonts.gstatic.com/s/simsun/v18/K9-BZD0b9T8xcP0Q.woff2) format('woff2');
            unicode-range: U+4E00-9FFF; /* Phạm vi cho ký tự Hán */
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .scene {
            width: 100%;
            height: 300px;
            perspective: 600px;
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            transition: 
                transform 0.6s, 
                opacity 0.3s, 
                left 0.4s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- HIỆU ỨNG TRƯỢT --- */
        .card.slide-next-out {
            transform: translateX(-100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card.slide-prev-out {
            transform: translateX(100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #ffffff;
        }

        /* YÊU CẦU: Mặt trước chữ Hán, font Simsun, màu đen, ở giữa */
        .card__face--front {
            font-family: 'Simsun', sans-serif; 
            font-size: 80px;
            color: #000000; /* Chữ màu đen */
        }

        .card__face--back {
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center; 
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
        }
        
        .back-content p {
            font-size: 1.3rem;
            margin: 8px 0;
            width: 100%;
            text-align: center; 
            font-weight: 500;
        }
        
        .back-content .pinyin { color: #e67e22; font-weight: bold; font-size: 1.6rem; } /* Màu cam */
        .back-content .hanviet { color: #8e44ad; } /* Màu tím */
        .back-content .nghia { color: #1f506b; font-style: italic; } /* Màu xanh đậm (thay vì #27ae60) */
        .back-content .vidu-han { color: #000000; font-family: 'Simsun', sans-serif; margin-top: 15px; font-size: 1.5rem; } /* Chữ Hán đen */
        .back-content .dichnghia { color: #000000; font-style: italic; font-size: 1rem; } /* Chữ đen */


        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-button {
            padding: 10px 20px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 0 5px;
        }

        .nav-button:hover {
            background-color: #2980b9;
        }
        
        #counter {
            font-size: 1.1rem;
            font-weight: bold;
            color: #7f8c8d;
            flex-grow: 1;
            text-align: center;
        }
        
        .jump-control {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        #jump-input {
            width: 60px;
            padding: 8px;
            border: 2px solid #3498db;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
        }
        
        .jump-button {
            background-color: #e74c3c; 
        }
        
        .jump-button:hover {
            background-color: #c0392b;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard Tiếng Trung</h1>
        <div class="scene">
            <div id="flashcard-container"></div>
        </div>
        <div class="navigation">
            <button class="nav-button" id="prev-btn">Trước</button>
            <span id="counter"></span>
            <button class="nav-button" id="next-btn">Sau</button>
        </div>
        
        <div class="jump-control">
            <input type="number" id="jump-input" min="1" max="30" placeholder="#">
            <button class="nav-button jump-button" id="jump-btn">Nhảy đến thẻ số</button>
        </div>
    </div>

    <script>
        // 30 từ vựng Hán ngữ giản thể được lấy từ shengci.txt
        const cardData = [
  { hanzi: '生活', pinyin: 'shēnghuó', hanviet: 'Sinh Hoạt', nghia: 'Cuộc sống, sinh hoạt', vidu: '他在中国**生活**了三年。', dichnghia: 'Anh ấy đã **sống** ở Trung Quốc ba năm.' },
  { hanzi: '差不多', pinyin: 'chàbuduō', hanviet: 'Sai Bất Đa', nghia: 'Gần như, hầu như; Tàm tạm, kha khá', vidu: '他俩的年龄**差不多**。', dichnghia: 'Tuổi tác của hai người họ **gần như** nhau.' },
  { hanzi: '习惯', pinyin: 'xíguàn', hanviet: 'Tập Quán', nghia: 'Thói quen; quen với', vidu: '我已经**习惯**了这里的生活。', dichnghia: 'Tôi đã **quen với** cuộc sống ở đây rồi.' },
  { hanzi: '气候', pinyin: 'qìhòu', hanviet: 'Khí Hậu', nghia: 'Khí hậu', vidu: '这个城市的**气候**很宜人。', dichnghia: '**Khí hậu** của thành phố này rất dễ chịu.' },
  { hanzi: '干燥', pinyin: 'gānzào', hanviet: 'Can Táo', nghia: 'Khô ráo, khô khan', vidu: '北京的秋天很**干燥**。', dichnghia: 'Mùa thu ở Bắc Kinh rất **khô ráo**.' },
  { hanzi: '干净', pinyin: 'gānjìng', hanviet: 'Can Tịnh', nghia: 'Sạch sẽ', vidu: '请保持房间**干净**。', dichnghia: 'Xin hãy giữ phòng **sạch sẽ**.' },
  { hanzi: '油腻', pinyin: 'yóunì', hanviet: 'Du Nị', nghia: 'Béo ngậy, nhiều dầu mỡ', vidu: '我不太喜欢吃**油腻**的食物。', dichnghia: 'Tôi không thích ăn đồ ăn **nhiều dầu mỡ** lắm.' },
  { hanzi: '不过', pinyin: 'búguò', hanviet: 'Bất Quá', nghia: 'Tuy nhiên, nhưng mà', vidu: '他很聪明，**不过**不努力。', dichnghia: 'Anh ấy rất thông minh, **nhưng mà** không chịu cố gắng.' },
  { hanzi: '课间', pinyin: 'kèjiān', hanviet: 'Khóa Gian', nghia: 'Giờ giải lao', vidu: '**课间**休息十分钟。', dichnghia: 'Giờ giải lao nghỉ 10 phút.' },
  { hanzi: '块', pinyin: 'kuài', hanviet: 'Khối', nghia: 'Miếng, cục; đồng (đơn vị tiền tệ)', vidu: '给我一**块**蛋糕。', dichnghia: 'Cho tôi một **miếng** bánh kem.' },
  { hanzi: '点心', pinyin: 'diǎnxīn', hanviet: 'Điểm Tâm', nghia: 'Bánh ngọt, đồ ăn nhẹ, điểm tâm', vidu: '我们**课间**吃**点心**。', dichnghia: 'Chúng tôi ăn **đồ ăn nhẹ** vào giờ giải lao.' },
  { hanzi: '从来', pinyin: 'cónglái', hanviet: 'Tòng Lai', nghia: 'Từ trước đến nay (thường đi với phủ định)', vidu: '我**从来**不迟到。', dichnghia: 'Tôi **từ trước đến nay** không bao giờ đi muộn.' },
  { hanzi: '午觉', pinyin: 'wǔjiào', hanviet: 'Ngọ Giác', nghia: 'Ngủ trưa', vidu: '你有睡**午觉**的习惯吗？', dichnghia: 'Bạn có thói quen **ngủ trưa** không?' },
  { hanzi: '游泳', pinyin: 'yóuyǒng', hanviet: 'Du Vịnh', nghia: 'Bơi lội', vidu: '她喜欢去海边**游泳**。', dichnghia: 'Cô ấy thích **bơi lội** ở bãi biển.' },
  { hanzi: '功课', pinyin: 'gōngkè', hanviet: 'Công Khóa', nghia: 'Bài vở, bài tập về nhà', vidu: '他每天都认真做**功课**。', dichnghia: 'Anh ấy làm **bài tập** nghiêm túc mỗi ngày.' },
  { hanzi: '记住', pinyin: 'jìzhù', hanviet: 'Ký Trụ', nghia: 'Ghi nhớ, nhớ kỹ', vidu: '请你**记住**我的电话号码。', dichnghia: 'Xin bạn **ghi nhớ** số điện thoại của tôi.' },
  { hanzi: '一般', pinyin: 'yībān', hanviet: 'Nhất Ban', nghia: 'Bình thường, thông thường, nói chung', vidu: '我**一般**早上七点起床。', dichnghia: 'Tôi **thông thường** thức dậy lúc 7 giờ sáng.' },
  { hanzi: '感谢', pinyin: 'gǎnxiè', hanviet: 'Cảm Tạ', nghia: 'Cảm ơn, cảm tạ', vidu: '我非常**感谢**你的帮助。', dichnghia: 'Tôi vô cùng **cảm ơn** sự giúp đỡ của bạn.' },
  { hanzi: '父母', pinyin: 'fùmǔ', hanviet: 'Phụ Mẫu', nghia: 'Cha mẹ', vidu: '我爱我的**父母**。', dichnghia: 'Tôi yêu **cha mẹ** của tôi.' },
  { hanzi: '机会', pinyin: 'jīhuì', hanviet: 'Cơ Hội', nghia: 'Cơ hội', vidu: '我得到一个学习的**机会**。', dichnghia: 'Tôi có được một **cơ hội** học tập.' },
  { hanzi: '原来', pinyin: 'yuánlái', hanviet: 'Nguyên Lai', nghia: 'Ban đầu, vốn dĩ; Hóa ra là', vidu: '**原来**是你！', dichnghia: '**Hóa ra** là bạn!' },
  { hanzi: '气功', pinyin: 'qìgōng', hanviet: 'Khí Công', nghia: 'Khí công', vidu: '他每天早上练习**气功**。', dichnghia: 'Anh ấy luyện tập **khí công** mỗi sáng.' },
  { hanzi: '不一定', pinyin: 'bù yīdìng', hanviet: 'Bất Nhất Định', nghia: 'Không nhất định, chưa chắc', vidu: '明天**不一定**下雨。', dichnghia: 'Ngày mai **chưa chắc** đã mưa.' },
  { hanzi: '钟头', pinyin: 'zhōngtóu', hanviet: 'Chung Đầu', nghia: 'Giờ, tiếng đồng hồ', vidu: '我们等了两个**钟头**。', dichnghia: 'Chúng tôi đã đợi hai **tiếng đồng hồ**.' },
  { hanzi: '效果', pinyin: 'xiàoguǒ', hanviet: 'Hiệu Quả', nghia: 'Hiệu quả', vidu: '这种药的**效果**很好。', dichnghia: '**Hiệu quả** của loại thuốc này rất tốt.' },
  { hanzi: '挺', pinyin: 'tǐng', hanviet: 'Đĩnh', nghia: 'Rất, khá (thông tục)', vidu: '这个地方**挺**不错。', dichnghia: 'Nơi này **khá** tốt.' },
  { hanzi: '好处', pinyin: 'hǎochù', hanviet: 'Hảo Xứ', nghia: 'Lợi ích, điểm tốt', vidu: '多运动有很多**好处**。', dichnghia: 'Tập thể dục nhiều có rất nhiều **lợi ích**.' },
  { hanzi: '坏处', pinyin: 'huàichu', hanviet: 'Hoại Xứ', nghia: 'Điểm xấu, bất lợi', vidu: '吸烟对身体有**坏处**。', dichnghia: 'Hút thuốc có **hại** cho sức khỏe.' },
  { hanzi: '慢性病', pinyin: 'mànxìngbìng', hanviet: 'Mạn Tính Bệnh', nghia: 'Bệnh mãn tính', vidu: '老年人容易得**慢性病**。', dichnghia: 'Người già dễ mắc **bệnh mãn tính**.' },
  { hanzi: '高血压', pinyin: 'gāoxuèyā', hanviet: 'Cao Huyết Áp', nghia: 'Huyết áp cao', vidu: '他患有**高血压**。', dichnghia: 'Ông ấy mắc bệnh **huyết áp cao**.' },
  { hanzi: '失眠', pinyin: 'shīmián', hanviet: 'Thất Miên', nghia: 'Mất ngủ', vidu: '我最近常常**失眠**。', dichnghia: 'Gần đây tôi thường xuyên bị **mất ngủ**.' },
  { hanzi: '必须', pinyin: 'bìxū', hanviet: 'Tất Tu', nghia: 'Cần phải, bắt buộc phải', vidu: '你**必须**完成作业。', dichnghia: 'Bạn **bắt buộc** phải hoàn thành bài tập.' },
  { hanzi: '打鱼', pinyin: 'dǎ yú', hanviet: 'Đả Ngư', nghia: 'Đánh bắt cá, câu cá', vidu: '他靠**打鱼**为生。', dichnghia: 'Ông ấy sống bằng nghề **đánh cá**.' },
  { hanzi: '晒', pinyin: 'shài', hanviet: 'Sái', nghia: 'Phơi (nắng)', vidu: '衣服洗好要**晒**干。', dichnghia: 'Quần áo giặt xong phải **phơi** khô.' },
  { hanzi: '延长', pinyin: 'yáncháng', hanviet: 'Duyên Trường', nghia: 'Kéo dài', vidu: '会议时间**延长**了。', dichnghia: 'Thời gian cuộc họp đã **kéo dài**.' }
];

        const flashcardContainer = document.getElementById('flashcard-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const jumpInput = document.getElementById('jump-input');
        const counter = document.getElementById('counter');

        let currentIndex = 0;
        let isTransitioning = false; 
        const totalCards = cardData.length;
        
        // Biến xử lý Vuốt (Swipe)
        let touchstartX = 0;
        let touchendX = 0;
        const SWIPE_THRESHOLD = 50; 
        
        jumpInput.max = totalCards;
        
        function renderCard(index) {
            const currentCard = cardData[index];
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            cardElement.id = 'flashcard-' + index;

            // Mặt trước: Chữ Hán, Simsun, Đen
            cardElement.innerHTML = `
                <div class="card__face card__face--front">${currentCard.hanzi}</div>
                <div class="card__face card__face--back">
                    <div class="back-content">
                        <p class="pinyin">${currentCard.pinyin}</p>
                        <p class="hanviet">${currentCard.hanviet}</p>
                        <p class="nghia">${currentCard.nghia}</p>
                        <p class="vidu-han">${currentCard.vidu}</p>
                        <p class="dichnghia">${currentCard.dichnghia}</p>
                    </div>
                </div>
            `;
            
            // Xử lý sự kiện lật thẻ
            cardElement.addEventListener('click', () => {
                if (!isTransitioning) {
                    cardElement.classList.toggle('is-flipped');
                }
            });

            // --- Logic Swipe ---
            cardElement.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, false);

            cardElement.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleGesture();
            }, false);
            
            return cardElement;
        }
        
        function updateDisplay() {
            counter.textContent = `${currentIndex + 1} / ${totalCards}`;
        }

        function changeCard(newIndex, direction) {
            if (isTransitioning || newIndex === currentIndex) {
                return;
            }

            if (newIndex < 0) {
                newIndex = totalCards - 1;
            } else if (newIndex >= totalCards) {
                newIndex = 0;
            }

            isTransitioning = true;
            const oldCard = document.getElementById('flashcard-' + currentIndex);
            const newCard = renderCard(newIndex);
            
            let slideDirection = direction;
            if (!slideDirection) {
                slideDirection = (newIndex > currentIndex || (currentIndex === totalCards - 1 && newIndex === 0)) ? 'next' : 'prev';
            }
            
            newCard.style.left = slideDirection === 'next' ? '100%' : '-100%';
            flashcardContainer.appendChild(newCard);
            
            if (oldCard) {
                oldCard.classList.add(slideDirection === 'next' ? 'slide-next-out' : 'slide-prev-out');
            }

            setTimeout(() => {
                newCard.style.left = '0';
            }, 50); 

            setTimeout(() => {
                if (oldCard) {
                    oldCard.remove();
                }
                currentIndex = newIndex;
                updateDisplay();
                isTransitioning = false;
            }, 400); 
        }
        
        function goToNextCard() {
            const newIndex = (currentIndex + 1) % totalCards;
            changeCard(newIndex, 'next');
        }

        function goToPrevCard() {
            const newIndex = (currentIndex - 1 + totalCards) % totalCards;
            changeCard(newIndex, 'prev');
        }
        
        function jumpToCard() {
            const inputValue = parseInt(jumpInput.value);
            
            if (isNaN(inputValue) || inputValue < 1 || inputValue > totalCards) {
                alert(`Lỗi: Vui lòng nhập số thẻ hợp lệ từ 1 đến ${totalCards}.`);
                jumpInput.value = "";
                return;
            }
            
            const newIndex = inputValue - 1;

            const direction = (newIndex > currentIndex) ? 'next' : 'prev';
            
            changeCard(newIndex, direction);

            jumpInput.value = "";
        }

        function handleGesture() {
            if (isTransitioning) return;
            const deltaX = touchendX - touchstartX;
            
            if (Math.abs(deltaX) > SWIPE_THRESHOLD) {
                if (deltaX < 0) {
                    goToNextCard();
                } else {
                    goToPrevCard();
                }
            }
        }

        prevBtn.addEventListener('click', goToPrevCard);
        nextBtn.addEventListener('click', goToNextCard);
        jumpBtn.addEventListener('click', jumpToCard);
        
        jumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                jumpToCard();
            }
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            flashcardContainer.appendChild(renderCard(currentIndex));
            updateDisplay();
        });

    </script>
</body>

</html>
