<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Tiếng Trung</title>
    <style>
        /* CSS để nhúng font Simsun */
        @font-face {
            font-family: 'Simsun';
            src: url(https://fonts.gstatic.com/s/simsun/v18/K9-BZD0b9T8xcP0Q.woff2) format('woff2');
            unicode-range: U+4E00-9FFF; /* Phạm vi cho ký tự Hán */
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .scene {
            width: 100%;
            height: 300px;
            perspective: 600px;
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            transition: 
                transform 0.6s, 
                opacity 0.3s, 
                left 0.4s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- HIỆU ỨNG TRƯỢT --- */
        .card.slide-next-out {
            transform: translateX(-100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card.slide-prev-out {
            transform: translateX(100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #ffffff;
        }

        /* YÊU CẦU: Mặt trước chữ Hán, font Simsun, màu đen, ở giữa */
        .card__face--front {
            font-family: 'Simsun', sans-serif; 
            font-size: 80px;
            color: #000000; /* Chữ màu đen */
        }

        .card__face--back {
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center; 
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
        }
        
        .back-content p {
            font-size: 1.3rem;
            margin: 8px 0;
            width: 100%;
            text-align: center; 
            font-weight: 500;
        }
        
        .back-content .pinyin { color: #e67e22; font-weight: bold; font-size: 1.6rem; } /* Màu cam */
        .back-content .hanviet { color: #8e44ad; } /* Màu tím */
        .back-content .nghia { color: #1f506b; font-style: italic; } /* Màu xanh đậm (thay vì #27ae60) */
        .back-content .vidu-han { color: #000000; font-family: 'Simsun', sans-serif; margin-top: 15px; font-size: 1.5rem; } /* Chữ Hán đen */
        .back-content .dichnghia { color: #000000; font-style: italic; font-size: 1rem; } /* Chữ đen */


        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-button {
            padding: 10px 20px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 0 5px;
        }

        .nav-button:hover {
            background-color: #2980b9;
        }
        
        #counter {
            font-size: 1.1rem;
            font-weight: bold;
            color: #7f8c8d;
            flex-grow: 1;
            text-align: center;
        }
        
        .jump-control {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        #jump-input {
            width: 60px;
            padding: 8px;
            border: 2px solid #3498db;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
        }
        
        .jump-button {
            background-color: #e74c3c; 
        }
        
        .jump-button:hover {
            background-color: #c0392b;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard Tiếng Trung</h1>
        <div class="scene">
            <div id="flashcard-container"></div>
        </div>
        <div class="navigation">
            <button class="nav-button" id="prev-btn">Trước</button>
            <span id="counter"></span>
            <button class="nav-button" id="next-btn">Sau</button>
        </div>
        
        <div class="jump-control">
            <input type="number" id="jump-input" min="1" max="30" placeholder="#">
            <button class="nav-button jump-button" id="jump-btn">Nhảy đến thẻ số</button>
        </div>
    </div>

    <script>
        // 30 từ vựng Hán ngữ giản thể được lấy từ shengci.txt
        const cardData = [
  { hanzi: '病人', pinyin: 'bìngrén', hanviet: 'Bệnh Nhân', nghia: 'Bệnh nhân', vidu: '这位病人需要休息。', dichnghia: 'Bệnh nhân này cần nghỉ ngơi.' },
  { hanzi: '肚子', pinyin: 'dùzi', hanviet: 'Đỗ Tử', nghia: 'Bụng', vidu: '我肚子有点儿疼。', dichnghia: 'Bụng tôi hơi đau.' },
  { hanzi: '厉害', pinyin: 'lìhai', hanviet: 'Lợi Hại', nghia: 'Ghê gớm, dữ dội, nghiêm trọng', vidu: '她头疼得很厉害。', dichnghia: 'Cô ấy đau đầu rất dữ dội.' },
  { hanzi: '片', pinyin: 'piàn', hanviet: 'Phiến', nghia: 'Viên (lượng từ cho thuốc); Miếng, lát', vidu: '请给我一片止疼片。', dichnghia: 'Xin hãy cho tôi một viên thuốc giảm đau.' },
  { hanzi: '拉肚子', pinyin: 'lā dùzi', hanviet: 'Lạp Đỗ Tử', nghia: 'Tiêu chảy', vidu: '他昨天吃了不干净的东西，拉肚子了。', dichnghia: 'Hôm qua anh ấy ăn phải đồ không sạch nên bị tiêu chảy rồi.' },
  { hanzi: '化验', pinyin: 'huàyàn', hanviet: 'Hóa Nghiệm', nghia: 'Xét nghiệm', vidu: '医生让我去化验一下血。', dichnghia: 'Bác sĩ bảo tôi đi xét nghiệm máu một chút.' },
  { hanzi: '大便', pinyin: 'dàbiàn', hanviet: 'Đại Tiện', nghia: 'Đại tiện, phân', vidu: '需要大便化验吗？', dichnghia: 'Có cần xét nghiệm phân không?' },
  { hanzi: '小便', pinyin: 'xiǎobiàn', hanviet: 'Tiểu Tiện', nghia: 'Tiểu tiện, nước tiểu', vidu: '请留一点小便样本。', dichnghia: 'Xin hãy lấy một chút mẫu nước tiểu.' },
  { hanzi: '检查', pinyin: 'jiǎnchá', hanviet: 'Kiểm Tra', nghia: 'Kiểm tra', vidu: '医生给我做了全身检查。', dichnghia: 'Bác sĩ đã kiểm tra toàn thân cho tôi.' },
  { hanzi: '结果', pinyin: 'jiéguǒ', hanviet: 'Kết Quả', nghia: 'Kết quả', vidu: '结果什么时候能出来？', dichnghia: 'Kết quả khi nào có thể có?' },
  { hanzi: '出来', pinyin: 'chūlái', hanviet: 'Xuất Lai', nghia: 'Ra (xu hướng); Hoàn thành (kết quả)', vidu: '化验结果很快就能出来。', dichnghia: 'Kết quả xét nghiệm sẽ sớm có thôi.' },
  { hanzi: '肠炎', pinyin: 'chángyán', hanviet: 'Tràng Viêm', nghia: 'Viêm ruột', vidu: '他得了急性肠炎。', dichnghia: 'Anh ấy bị viêm ruột cấp tính.' },
  { hanzi: '消化', pinyin: 'xiāohuà', hanviet: 'Tiêu Hóa', nghia: 'Tiêu hóa', vidu: '我的消化不太好。', dichnghia: 'Tiêu hóa của tôi không được tốt lắm.' },
  { hanzi: '开', pinyin: 'kāi', hanviet: 'Khai', nghia: 'Kê (thuốc); Mở', vidu: '医生给病人开了些药。', dichnghia: 'Bác sĩ đã kê cho bệnh nhân một ít thuốc.' },
  { hanzi: '打针', pinyin: 'dǎ zhēn', hanviet: 'Đả Châm', nghia: 'Tiêm thuốc, chích', vidu: '孩子害怕打针。', dichnghia: 'Trẻ con sợ tiêm thuốc.' },
  { hanzi: '哭', pinyin: 'kū', hanviet: 'Khốc', nghia: 'Khóc', vidu: '她伤心地哭了起来。', dichnghia: 'Cô ấy khóc vì quá đau lòng.' },
  { hanzi: '寂寞', pinyin: 'jìmò', hanviet: 'Tịch Mịch', nghia: 'Cô đơn, buồn bã', vidu: '他一个人住，感到很 cô đơn。', dichnghia: 'Anh ấy sống một mình, cảm thấy rất cô đơn.' },
  { hanzi: '所以', pinyin: 'suǒyǐ', hanviet: 'Sở Dĩ', nghia: 'Cho nên, vì vậy', vidu: '因为下雨，所以我们没去。', dichnghia: 'Bởi vì trời mưa, cho nên chúng tôi không đi.' },
  { hanzi: '难过', pinyin: 'nánguò', hanviet: 'Nan Quá', nghia: 'Buồn bã, khó chịu', vidu: '听到这个消息，我很难难 qua。', dichnghia: 'Nghe tin này, tôi rất buồn bã.' },
  { hanzi: '礼堂', pinyin: 'lǐtáng', hanviet: 'Lễ Đường', nghia: 'Hội trường', vidu: '他们将在礼 đường举行会议。', dichnghia: 'Họ sẽ tổ chức hội nghị ở hội trường.' },
  { hanzi: '舞会', pinyin: 'wǔhuì', hanviet: 'Vũ Hội', nghia: 'Vũ hội, tiệc khiêu vũ', vidu: 'Tối nay có một vũ hội lớn.', dichnghia: 'Tối nay có một vũ hội lớn.' },
  { hanzi: '跳舞', pinyin: 'tiào wǔ', hanviet: 'Khiêu Vũ', nghia: 'Nhảy múa, khiêu vũ', vidu: 'Cô ấy rất thích nhảy múa。', dichnghia: 'Cô ấy rất thích nhảy múa。' }
];

        const flashcardContainer = document.getElementById('flashcard-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const jumpInput = document.getElementById('jump-input');
        const counter = document.getElementById('counter');

        let currentIndex = 0;
        let isTransitioning = false; 
        const totalCards = cardData.length;
        
        // Biến xử lý Vuốt (Swipe)
        let touchstartX = 0;
        let touchendX = 0;
        const SWIPE_THRESHOLD = 50; 
        
        jumpInput.max = totalCards;
        
        function renderCard(index) {
            const currentCard = cardData[index];
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            cardElement.id = 'flashcard-' + index;

            // Mặt trước: Chữ Hán, Simsun, Đen
            cardElement.innerHTML = `
                <div class="card__face card__face--front">${currentCard.hanzi}</div>
                <div class="card__face card__face--back">
                    <div class="back-content">
                        <p class="pinyin">${currentCard.pinyin}</p>
                        <p class="hanviet">${currentCard.hanviet}</p>
                        <p class="nghia">${currentCard.nghia}</p>
                        <p class="vidu-han">${currentCard.vidu}</p>
                        <p class="dichnghia">${currentCard.dichnghia}</p>
                    </div>
                </div>
            `;
            
            // Xử lý sự kiện lật thẻ
            cardElement.addEventListener('click', () => {
                if (!isTransitioning) {
                    cardElement.classList.toggle('is-flipped');
                }
            });

            // --- Logic Swipe ---
            cardElement.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, false);

            cardElement.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleGesture();
            }, false);
            
            return cardElement;
        }
        
        function updateDisplay() {
            counter.textContent = `${currentIndex + 1} / ${totalCards}`;
        }

        function changeCard(newIndex, direction) {
            if (isTransitioning || newIndex === currentIndex) {
                return;
            }

            if (newIndex < 0) {
                newIndex = totalCards - 1;
            } else if (newIndex >= totalCards) {
                newIndex = 0;
            }

            isTransitioning = true;
            const oldCard = document.getElementById('flashcard-' + currentIndex);
            const newCard = renderCard(newIndex);
            
            let slideDirection = direction;
            if (!slideDirection) {
                slideDirection = (newIndex > currentIndex || (currentIndex === totalCards - 1 && newIndex === 0)) ? 'next' : 'prev';
            }
            
            newCard.style.left = slideDirection === 'next' ? '100%' : '-100%';
            flashcardContainer.appendChild(newCard);
            
            if (oldCard) {
                oldCard.classList.add(slideDirection === 'next' ? 'slide-next-out' : 'slide-prev-out');
            }

            setTimeout(() => {
                newCard.style.left = '0';
            }, 50); 

            setTimeout(() => {
                if (oldCard) {
                    oldCard.remove();
                }
                currentIndex = newIndex;
                updateDisplay();
                isTransitioning = false;
            }, 400); 
        }
        
        function goToNextCard() {
            const newIndex = (currentIndex + 1) % totalCards;
            changeCard(newIndex, 'next');
        }

        function goToPrevCard() {
            const newIndex = (currentIndex - 1 + totalCards) % totalCards;
            changeCard(newIndex, 'prev');
        }
        
        function jumpToCard() {
            const inputValue = parseInt(jumpInput.value);
            
            if (isNaN(inputValue) || inputValue < 1 || inputValue > totalCards) {
                alert(`Lỗi: Vui lòng nhập số thẻ hợp lệ từ 1 đến ${totalCards}.`);
                jumpInput.value = "";
                return;
            }
            
            const newIndex = inputValue - 1;

            const direction = (newIndex > currentIndex) ? 'next' : 'prev';
            
            changeCard(newIndex, direction);

            jumpInput.value = "";
        }

        function handleGesture() {
            if (isTransitioning) return;
            const deltaX = touchendX - touchstartX;
            
            if (Math.abs(deltaX) > SWIPE_THRESHOLD) {
                if (deltaX < 0) {
                    goToNextCard();
                } else {
                    goToPrevCard();
                }
            }
        }

        prevBtn.addEventListener('click', goToPrevCard);
        nextBtn.addEventListener('click', goToNextCard);
        jumpBtn.addEventListener('click', jumpToCard);
        
        jumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                jumpToCard();
            }
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            // Dòng code đã được thêm/sửa để hiển thị thẻ đầu tiên
            flashcardContainer.appendChild(renderCard(currentIndex));
            updateDisplay();
        });

    </script>
</body>

</html>
