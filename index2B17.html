<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Tiếng Trung</title>
    <style>
        /* CSS để nhúng font Simsun */
        @font-face {
            font-family: 'Simsun';
            src: url(https://fonts.gstatic.com/s/simsun/v18/K9-BZD0b9T8xcP0Q.woff2) format('woff2');
            unicode-range: U+4E00-9FFF; /* Phạm vi cho ký tự Hán */
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .scene {
            width: 100%;
            height: 300px;
            perspective: 600px;
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            transition: 
                transform 0.6s, 
                opacity 0.3s, 
                left 0.4s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- HIỆU ỨNG TRƯỢT --- */
        .card.slide-next-out {
            transform: translateX(-100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card.slide-prev-out {
            transform: translateX(100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #ffffff;
        }

        /* YÊU CẦU: Mặt trước chữ Hán, font Simsun, màu đen, ở giữa */
        .card__face--front {
            font-family: 'Simsun', sans-serif; 
            font-size: 80px;
            color: #000000; /* Chữ màu đen */
        }

        .card__face--back {
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center; 
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
        }
        
        .back-content p {
            font-size: 1.3rem;
            margin: 8px 0;
            width: 100%;
            text-align: center; 
            font-weight: 500;
        }
        
        .back-content .pinyin { color: #e67e22; font-weight: bold; font-size: 1.6rem; } /* Màu cam */
        .back-content .hanviet { color: #8e44ad; } /* Màu tím */
        .back-content .nghia { color: #1f506b; font-style: italic; } /* Màu xanh đậm (thay vì #27ae60) */
        .back-content .vidu-han { color: #000000; font-family: 'Simsun', sans-serif; margin-top: 15px; font-size: 1.5rem; } /* Chữ Hán đen */
        .back-content .dichnghia { color: #000000; font-style: italic; font-size: 1rem; } /* Chữ đen */


        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-button {
            padding: 10px 20px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 0 5px;
        }

        .nav-button:hover {
            background-color: #2980b9;
        }
        
        #counter {
            font-size: 1.1rem;
            font-weight: bold;
            color: #7f8c8d;
            flex-grow: 1;
            text-align: center;
        }
        
        .jump-control {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        #jump-input {
            width: 60px;
            padding: 8px;
            border: 2px solid #3498db;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
        }
        
        .jump-button {
            background-color: #e74c3c; 
        }
        
        .jump-button:hover {
            background-color: #c0392b;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard Tiếng Trung</h1>
        <div class="scene">
            <div id="flashcard-container"></div>
        </div>
        <div class="navigation">
            <button class="nav-button" id="prev-btn">Trước</button>
            <span id="counter"></span>
            <button class="nav-button" id="next-btn">Sau</button>
        </div>
        
        <div class="jump-control">
            <input type="number" id="jump-input" min="1" max="30" placeholder="#">
            <button class="nav-button jump-button" id="jump-btn">Nhảy đến thẻ số</button>
        </div>
    </div>

    <script>
        // 30 từ vựng Hán ngữ giản thể được lấy từ shengci.txt
        const cardData = [
  { hanzi: '在', pinyin: 'zài', hanviet: 'Tại', nghia: 'Ở, đang', vidu: '她在家。/ 我在吃饭。', dichnghia: 'Cô ấy ở nhà. / Tôi đang ăn cơm.' },
  { hanzi: '正在', pinyin: 'zhèngzài', hanviet: 'Chính tại', nghia: 'Đang (nhấn mạnh hành động diễn ra)', vidu: '他们正在看电视。', dichnghia: 'Họ đang xem TV.' },
  { hanzi: '正', pinyin: 'zhèng', hanviet: 'Chính', nghia: 'Đang (thường dùng trước động từ)', vidu: '他正忙着呢。', dichnghia: 'Anh ấy đang bận đấy.' },
  { hanzi: '出来', pinyin: 'chūlai', hanviet: 'Xuất lai', nghia: 'Ra đây, đi ra', vidu: '你快点儿出来！', dichnghia: 'Bạn mau ra đây đi!' },
  { hanzi: '出去', pinyin: 'chūqu', hanviet: 'Xuất khứ', nghia: 'Ra ngoài, đi ra ngoài', vidu: '我们出去走走吧。', dichnghia: 'Chúng ta ra ngoài đi dạo đi.' },
  { hanzi: '坐', pinyin: 'zuò', hanviet: 'Tọa', nghia: 'Ngồi', vidu: '请坐下休息一下。', dichnghia: 'Xin mời ngồi xuống nghỉ một chút.' },
  { hanzi: '骑', pinyin: 'qí', hanviet: 'Kỵ', nghia: 'Cưỡi (xe, ngựa)', vidu: '我每天骑自行车上班。', dichnghia: 'Tôi đạp xe đi làm mỗi ngày.' },
  { hanzi: '音乐', pinyin: 'yīnyuè', hanviet: 'Âm nhạc', nghia: 'Âm nhạc, nhạc', vidu: '我喜欢听流行音乐。', dichnghia: 'Tôi thích nghe nhạc pop (nhạc lưu hành).' },
  { hanzi: '录音', pinyin: 'lùyīn', hanviet: 'Lục âm', nghia: 'Ghi âm, bản ghi âm', vidu: '我们开始录音吧。', dichnghia: 'Chúng ta bắt đầu ghi âm đi.' },
  { hanzi: '录音机', pinyin: 'lùyīnjī', hanviet: 'Lục âm cơ', nghia: 'Máy ghi âm, máy cassette', vidu: '这个录音机坏了。', dichnghia: 'Cái máy ghi âm này bị hỏng rồi.' },
  { hanzi: '书店', pinyin: 'shūdiàn', hanviet: 'Thư điếm', nghia: 'Hiệu sách, nhà sách', vidu: '我去书店买书。', dichnghia: 'Tôi đi nhà sách mua sách.' },
  { hanzi: '药店', pinyin: 'yàodiàn', hanviet: 'Dược điếm', nghia: 'Hiệu thuốc, nhà thuốc', vidu: '药店就在医院旁边。', dichnghia: 'Hiệu thuốc ở ngay cạnh bệnh viện.' },
  { hanzi: '酒店', pinyin: 'jiǔdiàn', hanviet: 'Tửu điếm', nghia: 'Khách sạn, nhà nghỉ', vidu: '我们预订了一家酒店。', dichnghia: 'Chúng tôi đã đặt trước một khách sạn.' },
  { hanzi: '挤', pinyin: 'jǐ', hanviet: 'Tễ', nghia: 'Chen chúc, đông đúc; nặn, ép', vidu: '地铁里太挤了。', dichnghia: 'Trong tàu điện ngầm đông chen chúc quá.' },
  { hanzi: '一件事', pinyin: 'yí jiàn shì', hanviet: 'Nhất kiện sự', nghia: 'Một việc, một sự việc', vidu: '我想告诉你一件事。', dichnghia: 'Tôi muốn nói với bạn một việc.' },
  { hanzi: '一门课', pinyin: 'yì mén kè', hanviet: 'Nhất môn khóa', nghia: 'Một môn học', vidu: '我这学期选了五门课。', dichnghia: 'Học kỳ này tôi chọn 5 môn học.' },
  { hanzi: '一节课', pinyin: 'yì jié kè', hanviet: 'Nhất tiết khóa', nghia: 'Một tiết học', vidu: '今天我们只有一节课。', dichnghia: 'Hôm nay chúng ta chỉ có một tiết học.' },
  { hanzi: '教', pinyin: 'jiāo', hanviet: 'Giáo', nghia: 'Dạy, giảng dạy', vidu: '他教我们中文。', dichnghia: 'Anh ấy dạy chúng tôi tiếng Trung.' },
  { hanzi: '教师', pinyin: 'jiàoshī', hanviet: 'Giáo sư', nghia: 'Giáo viên, thầy/cô giáo', vidu: '那位教师很有经验。', dichnghia: 'Vị giáo viên kia rất có kinh nghiệm.' },
  { hanzi: '教师节', pinyin: 'Jiàoshījié', hanviet: 'Giáo sư tiết', nghia: 'Ngày Nhà giáo', vidu: '教师节快到了。', dichnghia: 'Sắp đến Ngày Nhà giáo rồi.' },
  { hanzi: '综合', pinyin: 'zōnghé', hanviet: 'Tổng hợp', nghia: 'Tổng hợp, toàn diện', vidu: '这是一个综合性的考试。', dichnghia: 'Đây là một bài kiểm tra mang tính tổng hợp.' },
  { hanzi: '口语', pinyin: 'kǒuyǔ', hanviet: 'Khẩu ngữ', nghia: 'Kỹ năng nói, khẩu ngữ', vidu: '我需要提高我的口语。', dichnghia: 'Tôi cần nâng cao kỹ năng nói của mình.' },
  { hanzi: '听力', pinyin: 'tīnglì', hanviet: 'Thính lực', nghia: 'Kỹ năng nghe, khả năng nghe', vidu: '多听中文可以提高听力。', dichnghia: 'Nghe tiếng Trung nhiều có thể nâng cao khả năng nghe.' },
  { hanzi: '阅读', pinyin: 'yuèdú', hanviet: 'Duyệt độc', nghia: 'Đọc, kỹ năng đọc', vidu: '阅读是学习语言的关键。', dichnghia: 'Đọc là chìa khóa để học ngôn ngữ.' },
  { hanzi: '体育', pinyin: 'tǐyù', hanviet: 'Thể dục', nghia: 'Thể dục, thể thao', vidu: '他很喜欢体育运动。', dichnghia: 'Anh ấy rất thích các môn thể thao.' },
  { hanzi: '文化', pinyin: 'wénhuà', hanviet: 'Văn hóa', nghia: 'Văn hóa', vidu: '我对中国文化很感兴趣。', dichnghia: 'Tôi rất hứng thú với văn hóa Trung Quốc.' }
];
        const flashcardContainer = document.getElementById('flashcard-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const jumpInput = document.getElementById('jump-input');
        const counter = document.getElementById('counter');

        let currentIndex = 0;
        let isTransitioning = false; 
        const totalCards = cardData.length;
        
        // Biến xử lý Vuốt (Swipe)
        let touchstartX = 0;
        let touchendX = 0;
        const SWIPE_THRESHOLD = 50; 
        
        jumpInput.max = totalCards;
        
        function renderCard(index) {
            const currentCard = cardData[index];
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            cardElement.id = 'flashcard-' + index;

            // Mặt trước: Chữ Hán, Simsun, Đen
            cardElement.innerHTML = `
                <div class="card__face card__face--front">${currentCard.hanzi}</div>
                <div class="card__face card__face--back">
                    <div class="back-content">
                        <p class="pinyin">${currentCard.pinyin}</p>
                        <p class="hanviet">${currentCard.hanviet}</p>
                        <p class="nghia">${currentCard.nghia}</p>
                        <p class="vidu-han">${currentCard.vidu}</p>
                        <p class="dichnghia">${currentCard.dichnghia}</p>
                    </div>
                </div>
            `;
            
            // Xử lý sự kiện lật thẻ
            cardElement.addEventListener('click', () => {
                if (!isTransitioning) {
                    cardElement.classList.toggle('is-flipped');
                }
            });

            // --- Logic Swipe ---
            cardElement.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, false);

            cardElement.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleGesture();
            }, false);
            
            return cardElement;
        }
        
        function updateDisplay() {
            counter.textContent = `${currentIndex + 1} / ${totalCards}`;
        }

        function changeCard(newIndex, direction) {
            if (isTransitioning || newIndex === currentIndex) {
                return;
            }

            if (newIndex < 0) {
                newIndex = totalCards - 1;
            } else if (newIndex >= totalCards) {
                newIndex = 0;
            }

            isTransitioning = true;
            const oldCard = document.getElementById('flashcard-' + currentIndex);
            const newCard = renderCard(newIndex);
            
            let slideDirection = direction;
            if (!slideDirection) {
                slideDirection = (newIndex > currentIndex || (currentIndex === totalCards - 1 && newIndex === 0)) ? 'next' : 'prev';
            }
            
            newCard.style.left = slideDirection === 'next' ? '100%' : '-100%';
            flashcardContainer.appendChild(newCard);
            
            if (oldCard) {
                oldCard.classList.add(slideDirection === 'next' ? 'slide-next-out' : 'slide-prev-out');
            }

            setTimeout(() => {
                newCard.style.left = '0';
            }, 50); 

            setTimeout(() => {
                if (oldCard) {
                    oldCard.remove();
                }
                currentIndex = newIndex;
                updateDisplay();
                isTransitioning = false;
            }, 400); 
        }
        
        function goToNextCard() {
            const newIndex = (currentIndex + 1) % totalCards;
            changeCard(newIndex, 'next');
        }

        function goToPrevCard() {
            const newIndex = (currentIndex - 1 + totalCards) % totalCards;
            changeCard(newIndex, 'prev');
        }
        
        function jumpToCard() {
            const inputValue = parseInt(jumpInput.value);
            
            if (isNaN(inputValue) || inputValue < 1 || inputValue > totalCards) {
                alert(`Lỗi: Vui lòng nhập số thẻ hợp lệ từ 1 đến ${totalCards}.`);
                jumpInput.value = "";
                return;
            }
            
            const newIndex = inputValue - 1;

            const direction = (newIndex > currentIndex) ? 'next' : 'prev';
            
            changeCard(newIndex, direction);

            jumpInput.value = "";
        }

        function handleGesture() {
            if (isTransitioning) return;
            const deltaX = touchendX - touchstartX;
            
            if (Math.abs(deltaX) > SWIPE_THRESHOLD) {
                if (deltaX < 0) {
                    goToNextCard();
                } else {
                    goToPrevCard();
                }
            }
        }

        prevBtn.addEventListener('click', goToPrevCard);
        nextBtn.addEventListener('click', goToNextCard);
        jumpBtn.addEventListener('click', jumpToCard);
        
        jumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                jumpToCard();
            }
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            flashcardContainer.appendChild(renderCard(currentIndex));
            updateDisplay();
        });

    </script>
</body>

</html>
