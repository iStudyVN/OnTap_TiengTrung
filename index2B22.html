<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Tiếng Trung</title>
    <style>
        /* CSS để nhúng font Simsun */
        @font-face {
            font-family: 'Simsun';
            src: url(https://fonts.gstatic.com/s/simsun/v18/K9-BZD0b9T8xcP0Q.woff2) format('woff2');
            unicode-range: U+4E00-9FFF; /* Phạm vi cho ký tự Hán */
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .scene {
            width: 100%;
            height: 300px;
            perspective: 600px;
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            transition: 
                transform 0.6s, 
                opacity 0.3s, 
                left 0.4s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- HIỆU ỨNG TRƯỢT --- */
        .card.slide-next-out {
            transform: translateX(-100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card.slide-prev-out {
            transform: translateX(100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #ffffff;
        }

        /* YÊU CẦU: Mặt trước chữ Hán, font Simsun, màu đen, ở giữa */
        .card__face--front {
            font-family: 'Simsun', sans-serif; 
            font-size: 80px;
            color: #000000; /* Chữ màu đen */
        }

        .card__face--back {
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center; 
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
        }
        
        .back-content p {
            font-size: 1.3rem;
            margin: 8px 0;
            width: 100%;
            text-align: center; 
            font-weight: 500;
        }
        
        .back-content .pinyin { color: #e67e22; font-weight: bold; font-size: 1.6rem; } /* Màu cam */
        .back-content .hanviet { color: #8e44ad; } /* Màu tím */
        .back-content .nghia { color: #1f506b; font-style: italic; } /* Màu xanh đậm (thay vì #27ae60) */
        .back-content .vidu-han { color: #000000; font-family: 'Simsun', sans-serif; margin-top: 15px; font-size: 1.5rem; } /* Chữ Hán đen */
        .back-content .dichnghia { color: #000000; font-style: italic; font-size: 1rem; } /* Chữ đen */


        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-button {
            padding: 10px 20px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 0 5px;
        }

        .nav-button:hover {
            background-color: #2980b9;
        }
        
        #counter {
            font-size: 1.1rem;
            font-weight: bold;
            color: #7f8c8d;
            flex-grow: 1;
            text-align: center;
        }
        
        .jump-control {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        #jump-input {
            width: 60px;
            padding: 8px;
            border: 2px solid #3498db;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
        }
        
        .jump-button {
            background-color: #e74c3c; 
        }
        
        .jump-button:hover {
            background-color: #c0392b;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard Tiếng Trung</h1>
        <div class="scene">
            <div id="flashcard-container"></div>
        </div>
        <div class="navigation">
            <button class="nav-button" id="prev-btn">Trước</button>
            <span id="counter"></span>
            <button class="nav-button" id="next-btn">Sau</button>
        </div>
        
        <div class="jump-control">
            <input type="number" id="jump-input" min="1" max="30" placeholder="#">
            <button class="nav-button jump-button" id="jump-btn">Nhảy đến thẻ số</button>
        </div>
    </div>

    <script>
        // 30 từ vựng Hán ngữ giản thể được lấy từ shengci.txt
        const cardData = [
  { hanzi: '大家', pinyin: 'dàjiā', hanviet: 'Đại gia', nghia: 'Mọi người, tất cả mọi người', vidu: '大家早上好！', dichnghia: 'Chào buổi sáng mọi người!' },
  { hanzi: '叫', pinyin: 'jiào', hanviet: 'Khiếu', nghia: 'Gọi, kêu', vidu: '你叫什么名字？', dichnghia: 'Bạn tên là gì?' },
  { hanzi: '让', pinyin: 'ràng', hanviet: 'Nhượng', nghia: 'Để, cho phép, nhường', vidu: '请让我帮你。', dichnghia: 'Xin hãy để tôi giúp bạn.' },
  { hanzi: '派', pinyin: 'pài', hanviet: 'Phái', nghia: 'Phái, cử đi', vidu: '公司派他去出差。', dichnghia: 'Công ty cử anh ấy đi công tác.' },
  { hanzi: '自己', pinyin: 'zìjǐ', hanviet: 'Tự kỷ', nghia: 'Chính mình, bản thân', vidu: '他自己完成了作业。', dichnghia: 'Anh ấy tự mình hoàn thành bài tập.' },
  { hanzi: '谈', pinyin: 'tán', hanviet: 'Đàm', nghia: 'Nói chuyện, đàm phán, bàn bạc', vidu: '我们谈谈你的学习吧。', dichnghia: 'Chúng ta nói chuyện về việc học của bạn đi.' },
  { hanzi: '唱歌', pinyin: 'chàng gē', hanviet: 'Xướng ca', nghia: 'Hát, ca hát', vidu: '她很喜欢唱歌。', dichnghia: 'Cô ấy rất thích ca hát.' },
  { hanzi: '京剧', pinyin: 'jīngjù', hanviet: 'Kinh kịch', nghia: 'Kinh kịch (Hát bội Bắc Kinh)', vidu: '他对京剧很了解。', dichnghia: 'Anh ấy rất hiểu về Kinh kịch.' },
  { hanzi: '电脑', pinyin: 'diànnǎo', hanviet: 'Điện não', nghia: 'Máy tính', vidu: '这台电脑很旧了。', dichnghia: 'Cái máy tính này cũ rồi.' },
  { hanzi: '玩儿', pinyin: 'wánr', hanviet: 'Ngoạn nhi', nghia: 'Chơi', vidu: '孩子们在公园玩儿。', dichnghia: 'Những đứa trẻ đang chơi trong công viên.' },
  { hanzi: '游戏', pinyin: 'yóuxì', hanviet: 'Du hí', nghia: 'Trò chơi, game', vidu: '他很喜欢玩电脑游戏。', dichnghia: 'Anh ấy rất thích chơi trò chơi máy tính.' },
  { hanzi: '感到', pinyin: 'gǎndào', hanviet: 'Cảm đáo', nghia: 'Cảm thấy, cảm nhận', vidu: '我感到非常高兴。', dichnghia: 'Tôi cảm thấy vô cùng vui vẻ.' },
  { hanzi: '愉快', pinyin: 'yúkuài', hanviet: 'Du khoái', nghia: 'Vui vẻ, vui sướng', vidu: '祝你周末愉快！', dichnghia: 'Chúc bạn cuối tuần vui vẻ!' },
  { hanzi: '心情', pinyin: 'xīnqíng', hanviet: 'Tâm tình', nghia: 'Tâm trạng', vidu: '她今天心情很好。', dichnghia: 'Tâm trạng cô ấy hôm nay rất tốt.' },
  { hanzi: '领工资', pinyin: 'lǐng gōngzī', hanviet: 'Lĩnh công tư', nghia: 'Lãnh lương, nhận lương', vidu: '今天是发工资的日子。', dichnghia: 'Hôm nay là ngày lãnh lương.' },
  { hanzi: '业余', pinyin: 'yèyú', hanviet: 'Nghiệp dư', nghia: 'Nghiệp dư, ngoài giờ làm', vidu: '业余时间他喜欢画画。', dichnghia: 'Thời gian rảnh (ngoài giờ làm) anh ấy thích vẽ tranh.' },
  { hanzi: '书法', pinyin: 'shūfǎ', hanviet: 'Thư pháp', nghia: 'Thư pháp', vidu: '她正在学习中国书法。', dichnghia: 'Cô ấy đang học thư pháp Trung Quốc.' },
  { hanzi: '开心', pinyin: 'kāixīn', hanviet: 'Khai tâm', nghia: 'Vui vẻ, vui lòng, vui sướng', vidu: '看到你很开心。', dichnghia: 'Gặp được bạn tôi rất vui.' },
  { hanzi: '特别', pinyin: 'tèbié', hanviet: 'Đặc biệt', nghia: 'Đặc biệt, nhất là; rất', vidu: '今天天气特别冷。', dichnghia: 'Thời tiết hôm nay đặc biệt lạnh.' },
  { hanzi: '非常', pinyin: 'fēicháng', hanviet: 'Phi thường', nghia: 'Vô cùng, rất', vidu: '我非常感谢你。', dichnghia: 'Tôi vô cùng cảm ơn bạn.' },
  { hanzi: '感兴趣', pinyin: 'gǎn xīngqù', hanviet: 'Cảm hứng thú', nghia: 'Cảm thấy hứng thú', vidu: '我对历史很感兴趣。', dichnghia: 'Tôi rất hứng thú với lịch sử.' },
  { hanzi: '画画儿', pinyin: 'huà huàr', hanviet: 'Họa họa nhi', nghia: 'Vẽ tranh', vidu: '她从小就喜欢画画儿。', dichnghia: 'Cô ấy thích vẽ tranh từ nhỏ.' },
  { hanzi: '绘画', pinyin: 'huìhuà', hanviet: 'Hội họa', nghia: 'Vẽ, hội họa', vidu: '绘画是一门艺术。', dichnghia: 'Hội họa là một môn nghệ thuật.' },
  { hanzi: '高兴', pinyin: 'gāoxìng', hanviet: 'Cao hứng', nghia: 'Vui vẻ, hân hoan', vidu: '见到你我很高兴。', dichnghia: 'Gặp được bạn tôi rất vui.' }
];

        const flashcardContainer = document.getElementById('flashcard-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const jumpInput = document.getElementById('jump-input');
        const counter = document.getElementById('counter');

        let currentIndex = 0;
        let isTransitioning = false; 
        const totalCards = cardData.length;
        
        // Biến xử lý Vuốt (Swipe)
        let touchstartX = 0;
        let touchendX = 0;
        const SWIPE_THRESHOLD = 50; 
        
        jumpInput.max = totalCards;
        
        function renderCard(index) {
            const currentCard = cardData[index];
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            cardElement.id = 'flashcard-' + index;

            // Mặt trước: Chữ Hán, Simsun, Đen
            cardElement.innerHTML = `
                <div class="card__face card__face--front">${currentCard.hanzi}</div>
                <div class="card__face card__face--back">
                    <div class="back-content">
                        <p class="pinyin">${currentCard.pinyin}</p>
                        <p class="hanviet">${currentCard.hanviet}</p>
                        <p class="nghia">${currentCard.nghia}</p>
                        <p class="vidu-han">${currentCard.vidu}</p>
                        <p class="dichnghia">${currentCard.dichnghia}</p>
                    </div>
                </div>
            `;
            
            // Xử lý sự kiện lật thẻ
            cardElement.addEventListener('click', () => {
                if (!isTransitioning) {
                    cardElement.classList.toggle('is-flipped');
                }
            });

            // --- Logic Swipe ---
            cardElement.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, false);

            cardElement.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleGesture();
            }, false);
            
            return cardElement;
        }
        
        function updateDisplay() {
            counter.textContent = `${currentIndex + 1} / ${totalCards}`;
        }

        function changeCard(newIndex, direction) {
            if (isTransitioning || newIndex === currentIndex) {
                return;
            }

            if (newIndex < 0) {
                newIndex = totalCards - 1;
            } else if (newIndex >= totalCards) {
                newIndex = 0;
            }

            isTransitioning = true;
            const oldCard = document.getElementById('flashcard-' + currentIndex);
            const newCard = renderCard(newIndex);
            
            let slideDirection = direction;
            if (!slideDirection) {
                slideDirection = (newIndex > currentIndex || (currentIndex === totalCards - 1 && newIndex === 0)) ? 'next' : 'prev';
            }
            
            newCard.style.left = slideDirection === 'next' ? '100%' : '-100%';
            flashcardContainer.appendChild(newCard);
            
            if (oldCard) {
                oldCard.classList.add(slideDirection === 'next' ? 'slide-next-out' : 'slide-prev-out');
            }

            setTimeout(() => {
                newCard.style.left = '0';
            }, 50); 

            setTimeout(() => {
                if (oldCard) {
                    oldCard.remove();
                }
                currentIndex = newIndex;
                updateDisplay();
                isTransitioning = false;
            }, 400); 
        }
        
        function goToNextCard() {
            const newIndex = (currentIndex + 1) % totalCards;
            changeCard(newIndex, 'next');
        }

        function goToPrevCard() {
            const newIndex = (currentIndex - 1 + totalCards) % totalCards;
            changeCard(newIndex, 'prev');
        }
        
        function jumpToCard() {
            const inputValue = parseInt(jumpInput.value);
            
            if (isNaN(inputValue) || inputValue < 1 || inputValue > totalCards) {
                alert(`Lỗi: Vui lòng nhập số thẻ hợp lệ từ 1 đến ${totalCards}.`);
                jumpInput.value = "";
                return;
            }
            
            const newIndex = inputValue - 1;

            const direction = (newIndex > currentIndex) ? 'next' : 'prev';
            
            changeCard(newIndex, direction);

            jumpInput.value = "";
        }

        function handleGesture() {
            if (isTransitioning) return;
            const deltaX = touchendX - touchstartX;
            
            if (Math.abs(deltaX) > SWIPE_THRESHOLD) {
                if (deltaX < 0) {
                    goToNextCard();
                } else {
                    goToPrevCard();
                }
            }
        }

        prevBtn.addEventListener('click', goToPrevCard);
        nextBtn.addEventListener('click', goToNextCard);
        jumpBtn.addEventListener('click', jumpToCard);
        
        jumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                jumpToCard();
            }
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            flashcardContainer.appendChild(renderCard(currentIndex));
            updateDisplay();
        });

    </script>
</body>

</html>
