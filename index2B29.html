<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Tiếng Trung</title>
    <style>
        /* CSS để nhúng font Simsun */
        @font-face {
            font-family: 'Simsun';
            src: url(https://fonts.gstatic.com/s/simsun/v18/K9-BZD0b9T8xcP0Q.woff2) format('woff2');
            unicode-range: U+4E00-9FFF; /* Phạm vi cho ký tự Hán */
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .scene {
            width: 100%;
            height: 300px;
            perspective: 600px;
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            transition: 
                transform 0.6s, 
                opacity 0.3s, 
                left 0.4s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- HIỆU ỨNG TRƯỢT --- */
        .card.slide-next-out {
            transform: translateX(-100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card.slide-prev-out {
            transform: translateX(100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #ffffff;
        }

        /* YÊU CẦU: Mặt trước chữ Hán, font Simsun, màu đen, ở giữa */
        .card__face--front {
            font-family: 'Simsun', sans-serif; 
            font-size: 80px;
            color: #000000; /* Chữ màu đen */
        }

        .card__face--back {
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center; 
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
        }
        
        .back-content p {
            font-size: 1.3rem;
            margin: 8px 0;
            width: 100%;
            text-align: center; 
            font-weight: 500;
        }
        
        .back-content .pinyin { color: #e67e22; font-weight: bold; font-size: 1.6rem; } /* Màu cam */
        .back-content .hanviet { color: #8e44ad; } /* Màu tím */
        .back-content .nghia { color: #1f506b; font-style: italic; } /* Màu xanh đậm (thay vì #27ae60) */
        .back-content .vidu-han { color: #000000; font-family: 'Simsun', sans-serif; margin-top: 15px; font-size: 1.5rem; } /* Chữ Hán đen */
        .back-content .dichnghia { color: #000000; font-style: italic; font-size: 1rem; } /* Chữ đen */


        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-button {
            padding: 10px 20px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 0 5px;
        }

        .nav-button:hover {
            background-color: #2980b9;
        }
        
        #counter {
            font-size: 1.1rem;
            font-weight: bold;
            color: #7f8c8d;
            flex-grow: 1;
            text-align: center;
        }
        
        .jump-control {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        #jump-input {
            width: 60px;
            padding: 8px;
            border: 2px solid #3498db;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
        }
        
        .jump-button {
            background-color: #e74c3c; 
        }
        
        .jump-button:hover {
            background-color: #c0392b;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard Tiếng Trung</h1>
        <div class="scene">
            <div id="flashcard-container"></div>
        </div>
        <div class="navigation">
            <button class="nav-button" id="prev-btn">Trước</button>
            <span id="counter"></span>
            <button class="nav-button" id="next-btn">Sau</button>
        </div>
        
        <div class="jump-control">
            <input type="number" id="jump-input" min="1" max="30" placeholder="#">
            <button class="nav-button jump-button" id="jump-btn">Nhảy đến thẻ số</button>
        </div>
    </div>

    <script>
        // 30 từ vựng Hán ngữ giản thể được lấy từ shengci.txt
        const cardData = [
  { hanzi: '考试', pinyin: 'kǎoshì', hanviet: 'Khảo Thí', nghia: 'Thi cử, kỳ thi', vidu: '我下周要参加汉语**考试**。', dichnghia: 'Tôi phải tham gia **kỳ thi** tiếng Hán vào tuần sau.' },
  { hanzi: '题', pinyin: 'tí', hanviet: 'Đề', nghia: 'Đề, câu hỏi (trong bài thi)', vidu: '这道**题**太难了。', dichnghia: '**Câu hỏi** này khó quá.' },
  { hanzi: '完', pinyin: 'wán', hanviet: 'Hoàn', nghia: 'Hoàn thành, xong', vidu: '你做**完**作业了吗？', dichnghia: 'Bạn đã làm **xong** bài tập chưa?' },
  { hanzi: '道', pinyin: 'dào', hanviet: 'Đạo', nghia: 'Câu, bài (lượng từ cho câu hỏi, mệnh lệnh)', vidu: '我只做对了一**道**题。', dichnghia: 'Tôi chỉ làm đúng một **câu** hỏi.' },
  { hanzi: '成绩', pinyin: 'chéngjì', hanviet: 'Thành Tích', nghia: 'Thành tích, kết quả học tập/thi cử', vidu: '你的**成绩**怎么样？', dichnghia: '**Thành tích** của bạn thế nào?' },
  { hanzi: '句子', pinyin: 'jùzi', hanviet: 'Cú Tử', nghia: 'Câu (ngôn ngữ)', vidu: '请把这个**句子**翻译成中文。', dichnghia: 'Xin hãy dịch **câu** này sang tiếng Trung.' },
  { hanzi: '看见', pinyin: 'kànjiàn', hanviet: 'Khán Kiến', nghia: 'Nhìn thấy', vidu: '我没**看见**他进来。', dichnghia: 'Tôi không **nhìn thấy** anh ấy đi vào.' },
  { hanzi: '词', pinyin: 'cí', hanviet: 'Từ', nghia: 'Từ, từ ngữ', vidu: '这个**词**是什么意思？', dichnghia: '**Từ** này có nghĩa là gì?' },
  { hanzi: '糟糕', pinyin: 'zāogāo', hanviet: 'Tao Cao', nghia: 'Hỏng bét, tồi tệ', vidu: '**糟糕**！我把钥匙忘了。', dichnghia: '**Hỏng bét**! Tôi quên mất chìa khóa rồi.' },
  { hanzi: '成', pinyin: 'chéng', hanviet: 'Thành', nghia: 'Thành (đạt), trở thành', vidu: '他**成**了一名医生。', dichnghia: 'Anh ấy **trở thành** một bác sĩ.' },
  { hanzi: '回信', pinyin: 'huí xìn', hanviet: 'Hồi Tín', nghia: 'Hồi âm, thư trả lời', vidu: '请尽快给我**回信**。', dichnghia: 'Xin hãy sớm **hồi âm** cho tôi.' },
  { hanzi: '故事', pinyin: 'gùshi', hanviet: 'Cố Sự', nghia: 'Câu chuyện', vidu: '这个**故事**很有趣。', dichnghia '**Câu chuyện** này rất thú vị.' },
  { hanzi: '有意思', pinyin: 'yǒu yìsi', hanviet: 'Hữu Ý Tứ', nghia: 'Thú vị, có ý nghĩa', vidu: '这本小说很**有意思**。', dichnghia: 'Cuốn tiểu thuyết này rất **thú vị**.' },
  { hanzi: '页', pinyin: 'yè', hanviet: 'Hiệt', nghia: 'Trang, tờ (sách)', vidu: '请打开第十**页**。', dichnghia: 'Xin hãy mở **trang** thứ mười.' },
  { hanzi: '笑', pinyin: 'xiào', hanviet: 'Tiếu', nghia: 'Cười', vidu: '他高兴地**笑**了。', dichnghia: 'Anh ấy **cười** vui vẻ.' },
  { hanzi: '会话', pinyin: 'huìhuà', hanviet: 'Hội Thoại', nghia: 'Hội thoại, đàm thoại', vidu: '我们练习中文**会话**。', dichnghia: 'Chúng tôi luyện tập **hội thoại** tiếng Trung.' },
  { hanzi: '念', pinyin: 'niàn', hanviet: 'Niệm', nghia: 'Đọc (to), học', vidu: '请大声**念**出这个词。', dichnghia: 'Xin hãy **đọc to** từ này.' },
  { hanzi: '答', pinyin: 'dá', hanviet: 'Đáp', nghia: 'Trả lời', vidu: '请**答**对所有问题。', dichnghia: 'Xin hãy **trả lời** đúng tất cả câu hỏi.' },
  { hanzi: '合上', pinyin: 'hé shàng', hanviet: 'Hợp Thượng', nghia: 'Khép lại, đóng lại', vidu: '请**合上**书本。', dichnghia: 'Xin hãy **khép lại** sách vở.' },
  { hanzi: '听见', pinyin: 'tīngjiàn', hanviet: 'Thính Kiến', nghia: 'Nghe thấy', vidu: '你**听见**我说的话了吗？', dichnghia: 'Bạn có **nghe thấy** lời tôi nói không?' },
  { hanzi: '打开', pinyin: 'dǎkāi', hanviet: 'Đả Khai', nghia: 'Mở ra', vidu: '请**打开**窗户。', dichnghia: 'Xin hãy **mở** cửa sổ ra.' },
  { hanzi: '作业', pinyin: 'zuòyè', hanviet: 'Tác Nghiệp', nghia: 'Bài tập (về nhà)', vidu: '我晚上要做**作业**。', dichnghia: 'Tôi phải làm **bài tập** vào buổi tối.' },
  { hanzi: '熟', pinyin: 'shú', hanviet: 'Thục', nghia: 'Quen thuộc; Thành thạo; Chín', vidu: '我对这儿很**熟**。', dichnghia: 'Tôi rất **quen thuộc** với nơi này.' }
];

        const flashcardContainer = document.getElementById('flashcard-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const jumpInput = document.getElementById('jump-input');
        const counter = document.getElementById('counter');

        let currentIndex = 0;
        let isTransitioning = false; 
        const totalCards = cardData.length;
        
        // Biến xử lý Vuốt (Swipe)
        let touchstartX = 0;
        let touchendX = 0;
        const SWIPE_THRESHOLD = 50; 
        
        jumpInput.max = totalCards;
        
        function renderCard(index) {
            const currentCard = cardData[index];
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            cardElement.id = 'flashcard-' + index;

            // Mặt trước: Chữ Hán, Simsun, Đen
            cardElement.innerHTML = `
                <div class="card__face card__face--front">${currentCard.hanzi}</div>
                <div class="card__face card__face--back">
                    <div class="back-content">
                        <p class="pinyin">${currentCard.pinyin}</p>
                        <p class="hanviet">${currentCard.hanviet}</p>
                        <p class="nghia">${currentCard.nghia}</p>
                        <p class="vidu-han">${currentCard.vidu}</p>
                        <p class="dichnghia">${currentCard.dichnghia}</p>
                    </div>
                </div>
            `;
            
            // Xử lý sự kiện lật thẻ
            cardElement.addEventListener('click', () => {
                if (!isTransitioning) {
                    cardElement.classList.toggle('is-flipped');
                }
            });

            // --- Logic Swipe ---
            cardElement.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, false);

            cardElement.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleGesture();
            }, false);
            
            return cardElement;
        }
        
        function updateDisplay() {
            counter.textContent = `${currentIndex + 1} / ${totalCards}`;
        }

        function changeCard(newIndex, direction) {
            if (isTransitioning || newIndex === currentIndex) {
                return;
            }

            if (newIndex < 0) {
                newIndex = totalCards - 1;
            } else if (newIndex >= totalCards) {
                newIndex = 0;
            }

            isTransitioning = true;
            const oldCard = document.getElementById('flashcard-' + currentIndex);
            const newCard = renderCard(newIndex);
            
            let slideDirection = direction;
            if (!slideDirection) {
                slideDirection = (newIndex > currentIndex || (currentIndex === totalCards - 1 && newIndex === 0)) ? 'next' : 'prev';
            }
            
            newCard.style.left = slideDirection === 'next' ? '100%' : '-100%';
            flashcardContainer.appendChild(newCard);
            
            if (oldCard) {
                oldCard.classList.add(slideDirection === 'next' ? 'slide-next-out' : 'slide-prev-out');
            }

            setTimeout(() => {
                newCard.style.left = '0';
            }, 50); 

            setTimeout(() => {
                if (oldCard) {
                    oldCard.remove();
                }
                currentIndex = newIndex;
                updateDisplay();
                isTransitioning = false;
            }, 400); 
        }
        
        function goToNextCard() {
            const newIndex = (currentIndex + 1) % totalCards;
            changeCard(newIndex, 'next');
        }

        function goToPrevCard() {
            const newIndex = (currentIndex - 1 + totalCards) % totalCards;
            changeCard(newIndex, 'prev');
        }
        
        function jumpToCard() {
            const inputValue = parseInt(jumpInput.value);
            
            if (isNaN(inputValue) || inputValue < 1 || inputValue > totalCards) {
                alert(`Lỗi: Vui lòng nhập số thẻ hợp lệ từ 1 đến ${totalCards}.`);
                jumpInput.value = "";
                return;
            }
            
            const newIndex = inputValue - 1;

            const direction = (newIndex > currentIndex) ? 'next' : 'prev';
            
            changeCard(newIndex, direction);

            jumpInput.value = "";
        }

        function handleGesture() {
            if (isTransitioning) return;
            const deltaX = touchendX - touchstartX;
            
            if (Math.abs(deltaX) > SWIPE_THRESHOLD) {
                if (deltaX < 0) {
                    goToNextCard();
                } else {
                    goToPrevCard();
                }
            }
        }

        prevBtn.addEventListener('click', goToPrevCard);
        nextBtn.addEventListener('click', goToNextCard);
        jumpBtn.addEventListener('click', jumpToCard);
        
        jumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                jumpToCard();
            }
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            flashcardContainer.appendChild(renderCard(currentIndex));
            updateDisplay();
        });

    </script>
</body>

</html>
