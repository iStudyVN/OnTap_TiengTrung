<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Tiếng Trung</title>
    <style>
        /* CSS để nhúng font Simsun */
        @font-face {
            font-family: 'Simsun';
            src: url(https://fonts.gstatic.com/s/simsun/v18/K9-BZD0b9T8xcP0Q.woff2) format('woff2');
            unicode-range: U+4E00-9FFF; /* Phạm vi cho ký tự Hán */
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .scene {
            width: 100%;
            height: 300px;
            perspective: 600px;
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            transition: 
                transform 0.6s, 
                opacity 0.3s, 
                left 0.4s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- HIỆU ỨNG TRƯỢT --- */
        .card.slide-next-out {
            transform: translateX(-100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card.slide-prev-out {
            transform: translateX(100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #ffffff;
        }

        /* YÊU CẦU: Mặt trước chữ Hán, font Simsun, màu đen, ở giữa */
        .card__face--front {
            font-family: 'Simsun', sans-serif; 
            font-size: 80px;
            color: #000000; /* Chữ màu đen */
        }

        .card__face--back {
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center; 
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
        }
        
        .back-content p {
            font-size: 1.3rem;
            margin: 8px 0;
            width: 100%;
            text-align: center; 
            font-weight: 500;
        }
        
        .back-content .pinyin { color: #e67e22; font-weight: bold; font-size: 1.6rem; } /* Màu cam */
        .back-content .hanviet { color: #8e44ad; } /* Màu tím */
        .back-content .nghia { color: #1f506b; font-style: italic; } /* Màu xanh đậm (thay vì #27ae60) */
        .back-content .vidu-han { color: #000000; font-family: 'Simsun', sans-serif; margin-top: 15px; font-size: 1.5rem; } /* Chữ Hán đen */
        .back-content .dichnghia { color: #000000; font-style: italic; font-size: 1rem; } /* Chữ đen */


        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-button {
            padding: 10px 20px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 0 5px;
        }

        .nav-button:hover {
            background-color: #2980b9;
        }
        
        #counter {
            font-size: 1.1rem;
            font-weight: bold;
            color: #7f8c8d;
            flex-grow: 1;
            text-align: center;
        }
        
        .jump-control {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        #jump-input {
            width: 60px;
            padding: 8px;
            border: 2px solid #3498db;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
        }
        
        .jump-button {
            background-color: #e74c3c; 
        }
        
        .jump-button:hover {
            background-color: #c0392b;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard Tiếng Trung</h1>
        <div class="scene">
            <div id="flashcard-container"></div>
        </div>
        <div class="navigation">
            <button class="nav-button" id="prev-btn">Trước</button>
            <span id="counter"></span>
            <button class="nav-button" id="next-btn">Sau</button>
        </div>
        
        <div class="jump-control">
            <input type="number" id="jump-input" min="1" max="30" placeholder="#">
            <button class="nav-button jump-button" id="jump-btn">Nhảy đến thẻ số</button>
        </div>
    </div>

    <script>
        // 30 từ vựng Hán ngữ giản thể được lấy từ shengci.txt
        const cardData_Dot7 = [
  { hanzi: '每', pinyin: 'měi', hanviet: 'Mỗi', nghia: 'Mỗi, mọi', vidu: '我每天学习中文。', dichnghia: 'Tôi học tiếng Trung mỗi ngày.' },
  { hanzi: '差', pinyin: 'chà', hanviet: 'Sai/Soa', nghia: 'Thiếu, kém (thường dùng để nói giờ)', vidu: '现在差五分八点。', dichnghia: 'Bây giờ là 8 giờ kém 5 phút.' },
  { hanzi: '刻', pinyin: 'kè', hanviet: 'Khắc', nghia: 'Khắc (1/4 giờ, 15 phút)', vidu: '现在是八点一刻。', dichnghia: 'Bây giờ là 8 giờ 15 phút.' },
  { hanzi: '起床', pinyin: 'qǐchuáng', hanviet: 'Khởi sàng', nghia: 'Thức dậy, rời giường', vidu: '我早上七点起床。', dichnghia: 'Tôi thức dậy lúc 7 giờ sáng.' },
  { hanzi: '睡觉', pinyin: 'shuìjiào', hanviet: 'Thụy giác', nghia: 'Ngủ', vidu: '你晚上几点睡觉？', dichnghia: 'Buổi tối bạn ngủ lúc mấy giờ?' },
  { hanzi: '教室', pinyin: 'jiàoshì', hanviet: 'Giáo thất', nghia: 'Phòng học, lớp học', vidu: '他们在教室里上课。', dichnghia: 'Họ đang học trong phòng học.' },
  { hanzi: '操场', pinyin: 'cāochǎng', hanviet: 'Thao trường', nghia: 'Sân vận động, sân tập', vidu: '学生们在操场上跑步。', dichnghia: 'Học sinh đang chạy bộ trên sân tập.' },
  { hanzi: '锻炼', pinyin: 'duànliàn', hanviet: 'Đoán luyện', nghia: 'Rèn luyện, tập luyện', vidu: '他每天早上都锻炼身体。', dichnghia: 'Anh ấy rèn luyện sức khỏe mỗi sáng.' },
  { hanzi: '洗手', pinyin: 'xǐshǒu', hanviet: 'Tẩy thủ', nghia: 'Rửa tay', vidu: '饭前要洗手。', dichnghia: 'Trước khi ăn cơm phải rửa tay.' },
  { hanzi: '洗碗', pinyin: 'xǐwǎn', hanviet: 'Tẩy oản', nghia: 'Rửa chén/bát', vidu: '谁来洗碗？', dichnghia: 'Ai sẽ rửa chén?' },
  { hanzi: '洗衣服', pinyin: 'xǐ yīfu', hanviet: 'Tẩy y phục', nghia: 'Giặt quần áo', vidu: '我周末要洗衣服。', dichnghia: 'Cuối tuần tôi phải giặt quần áo.' },
  { hanzi: '洗澡', pinyin: 'xǐzǎo', hanviet: 'Tẩy tảo', nghia: 'Tắm', vidu: '他每天晚上都洗澡。', dichnghia: 'Anh ấy tắm mỗi tối.' },
  { hanzi: '爬山', pinyin: 'pá shān', hanviet: 'Bò sơn', nghia: 'Leo núi', vidu: '周末我们一起去爬山吧。', dichnghia: 'Cuối tuần chúng ta cùng nhau đi leo núi đi.' },
  { hanzi: '年级', pinyin: 'niánjí', hanviet: 'Niên cấp', nghia: 'Năm học, khối lớp', vidu: '她上三年级。', dichnghia: 'Cô ấy học năm thứ ba (khối lớp ba).' },
  { hanzi: '准时', pinyin: 'zhǔnshí', hanviet: 'Chuẩn thời', nghia: 'Đúng giờ, đúng hẹn', vidu: '请准时到场。', dichnghia: 'Xin hãy đến đúng giờ.' },
  { hanzi: '出发', pinyin: 'chūfā', hanviet: 'Xuất phát', nghia: 'Xuất phát, khởi hành', vidu: '我们早上八点出发。', dichnghia: 'Chúng ta xuất phát lúc 8 giờ sáng.' },
  { hanzi: '集合', pinyin: 'jíhé', hanviet: 'Tập hợp', nghia: 'Tập hợp, tập trung', vidu: '请大家在校门口集合。', dichnghia: 'Xin mọi người tập trung ở cổng trường.' },
  { hanzi: '带', pinyin: 'dài', hanviet: 'Đái', nghia: 'Mang, dẫn, mang theo', vidu: '你带伞了吗？', dichnghia: 'Bạn mang ô (dù) chưa?' },
  { hanzi: '以前', pinyin: 'yǐqián', hanviet: 'Dĩ tiền', nghia: 'Trước đây, trước kia (tính từ một thời điểm trong quá khứ)', vidu: '以前她住在这里。', dichnghia: 'Trước đây cô ấy sống ở đây.' },
  { hanzi: '以后', pinyin: 'yǐhòu', hanviet: 'Dĩ hậu', nghia: 'Sau này, sau đó (tính từ một thời điểm trong tương lai)', vidu: '以后你要多注意。', dichnghia: 'Sau này bạn phải chú ý nhiều hơn.' },
  { hanzi: '之前', pinyin: 'zhīqián', hanviet: 'Chi tiền', nghia: 'Trước (một mốc thời gian/sự kiện cụ thể)', vidu: '上课之前我要预习。', dichnghia: 'Trước khi vào học tôi phải chuẩn bị bài.' },
  { hanzi: '之后', pinyin: 'zhīhòu', hanviet: 'Chi hậu', nghia: 'Sau (một mốc thời gian/sự kiện cụ thể)', vidu: '吃完饭之后我们去看电影。', dichnghia: 'Sau khi ăn cơm xong chúng ta đi xem phim.' },
  { hanzi: '后来', pinyin: 'hòulái', hanviet: 'Hậu lai', nghia: 'Sau đó, về sau (chỉ sự việc đã xảy ra trong quá khứ)', vidu: '他先去了北京，后来去了上海。', dichnghia: 'Anh ấy đi Bắc Kinh trước, sau đó đi Thượng Hải.' }
];

        const flashcardContainer = document.getElementById('flashcard-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const jumpInput = document.getElementById('jump-input');
        const counter = document.getElementById('counter');

        let currentIndex = 0;
        let isTransitioning = false; 
        const totalCards = cardData.length;
        
        // Biến xử lý Vuốt (Swipe)
        let touchstartX = 0;
        let touchendX = 0;
        const SWIPE_THRESHOLD = 50; 
        
        jumpInput.max = totalCards;
        
        function renderCard(index) {
            const currentCard = cardData[index];
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            cardElement.id = 'flashcard-' + index;

            // Mặt trước: Chữ Hán, Simsun, Đen
            cardElement.innerHTML = `
                <div class="card__face card__face--front">${currentCard.hanzi}</div>
                <div class="card__face card__face--back">
                    <div class="back-content">
                        <p class="pinyin">${currentCard.pinyin}</p>
                        <p class="hanviet">${currentCard.hanviet}</p>
                        <p class="nghia">${currentCard.nghia}</p>
                        <p class="vidu-han">${currentCard.vidu}</p>
                        <p class="dichnghia">${currentCard.dichnghia}</p>
                    </div>
                </div>
            `;
            
            // Xử lý sự kiện lật thẻ
            cardElement.addEventListener('click', () => {
                if (!isTransitioning) {
                    cardElement.classList.toggle('is-flipped');
                }
            });

            // --- Logic Swipe ---
            cardElement.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, false);

            cardElement.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleGesture();
            }, false);
            
            return cardElement;
        }
        
        function updateDisplay() {
            counter.textContent = `${currentIndex + 1} / ${totalCards}`;
        }

        function changeCard(newIndex, direction) {
            if (isTransitioning || newIndex === currentIndex) {
                return;
            }

            if (newIndex < 0) {
                newIndex = totalCards - 1;
            } else if (newIndex >= totalCards) {
                newIndex = 0;
            }

            isTransitioning = true;
            const oldCard = document.getElementById('flashcard-' + currentIndex);
            const newCard = renderCard(newIndex);
            
            let slideDirection = direction;
            if (!slideDirection) {
                slideDirection = (newIndex > currentIndex || (currentIndex === totalCards - 1 && newIndex === 0)) ? 'next' : 'prev';
            }
            
            newCard.style.left = slideDirection === 'next' ? '100%' : '-100%';
            flashcardContainer.appendChild(newCard);
            
            if (oldCard) {
                oldCard.classList.add(slideDirection === 'next' ? 'slide-next-out' : 'slide-prev-out');
            }

            setTimeout(() => {
                newCard.style.left = '0';
            }, 50); 

            setTimeout(() => {
                if (oldCard) {
                    oldCard.remove();
                }
                currentIndex = newIndex;
                updateDisplay();
                isTransitioning = false;
            }, 400); 
        }
        
        function goToNextCard() {
            const newIndex = (currentIndex + 1) % totalCards;
            changeCard(newIndex, 'next');
        }

        function goToPrevCard() {
            const newIndex = (currentIndex - 1 + totalCards) % totalCards;
            changeCard(newIndex, 'prev');
        }
        
        function jumpToCard() {
            const inputValue = parseInt(jumpInput.value);
            
            if (isNaN(inputValue) || inputValue < 1 || inputValue > totalCards) {
                alert(`Lỗi: Vui lòng nhập số thẻ hợp lệ từ 1 đến ${totalCards}.`);
                jumpInput.value = "";
                return;
            }
            
            const newIndex = inputValue - 1;

            const direction = (newIndex > currentIndex) ? 'next' : 'prev';
            
            changeCard(newIndex, direction);

            jumpInput.value = "";
        }

        function handleGesture() {
            if (isTransitioning) return;
            const deltaX = touchendX - touchstartX;
            
            if (Math.abs(deltaX) > SWIPE_THRESHOLD) {
                if (deltaX < 0) {
                    goToNextCard();
                } else {
                    goToPrevCard();
                }
            }
        }

        prevBtn.addEventListener('click', goToPrevCard);
        nextBtn.addEventListener('click', goToNextCard);
        jumpBtn.addEventListener('click', jumpToCard);
        
        jumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                jumpToCard();
            }
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            flashcardContainer.appendChild(renderCard(currentIndex));
            updateDisplay();
        });

    </script>
</body>

</html>
