<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Tiếng Trung</title>
    <style>
        /* CSS để nhúng font Simsun */
        @font-face {
            font-family: 'Simsun';
            src: url(https://fonts.gstatic.com/s/simsun/v18/K9-BZD0b9T8xcP0Q.woff2) format('woff2');
            unicode-range: U+4E00-9FFF; /* Phạm vi cho ký tự Hán */
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .scene {
            width: 100%;
            height: 300px;
            perspective: 600px;
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            transition: 
                transform 0.6s, 
                opacity 0.3s, 
                left 0.4s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- HIỆU ỨNG TRƯỢT --- */
        .card.slide-next-out {
            transform: translateX(-100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card.slide-prev-out {
            transform: translateX(100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #ffffff;
        }

        /* YÊU CẦU: Mặt trước chữ Hán, font Simsun, màu đen, ở giữa */
        .card__face--front {
            font-family: 'Simsun', sans-serif; 
            font-size: 80px;
            color: #000000; /* Chữ màu đen */
        }

        .card__face--back {
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center; 
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
        }
        
        .back-content p {
            font-size: 1.3rem;
            margin: 8px 0;
            width: 100%;
            text-align: center; 
            font-weight: 500;
        }
        
        .back-content .pinyin { color: #e67e22; font-weight: bold; font-size: 1.6rem; } /* Màu cam */
        .back-content .hanviet { color: #8e44ad; } /* Màu tím */
        .back-content .nghia { color: #1f506b; font-style: italic; } /* Màu xanh đậm (thay vì #27ae60) */
        .back-content .vidu-han { color: #000000; font-family: 'Simsun', sans-serif; margin-top: 15px; font-size: 1.5rem; } /* Chữ Hán đen */
        .back-content .dichnghia { color: #000000; font-style: italic; font-size: 1rem; } /* Chữ đen */


        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-button {
            padding: 10px 20px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 0 5px;
        }

        .nav-button:hover {
            background-color: #2980b9;
        }
        
        #counter {
            font-size: 1.1rem;
            font-weight: bold;
            color: #7f8c8d;
            flex-grow: 1;
            text-align: center;
        }
        
        .jump-control {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        #jump-input {
            width: 60px;
            padding: 8px;
            border: 2px solid #3498db;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
        }
        
        .jump-button {
            background-color: #e74c3c; 
        }
        
        .jump-button:hover {
            background-color: #c0392b;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard Tiếng Trung</h1>
        <div class="scene">
            <div id="flashcard-container"></div>
        </div>
        <div class="navigation">
            <button class="nav-button" id="prev-btn">Trước</button>
            <span id="counter"></span>
            <button class="nav-button" id="next-btn">Sau</button>
        </div>
        
        <div class="jump-control">
            <input type="number" id="jump-input" min="1" max="30" placeholder="#">
            <button class="nav-button jump-button" id="jump-btn">Nhảy đến thẻ số</button>
        </div>
    </div>

    <script>
        // 30 từ vựng Hán ngữ giản thể được lấy từ shengci.txt
       const cardData = [
  { hanzi: '前年', pinyin: 'qiánnián', hanviet: 'Tiền niên', nghia: 'Năm kia (hai năm trước)', vidu: '我前年来过这里。', dichnghia: 'Năm kia tôi đã từng đến đây.' },
  { hanzi: '后年', pinyin: 'hòunián', hanviet: 'Hậu niên', nghia: 'Năm kia (hai năm sau)', vidu: '我们后年再见面。', dichnghia: 'Chúng ta gặp lại nhau vào năm kia.' },
  { hanzi: '多高', pinyin: 'duō gāo', hanviet: 'Đa cao', nghia: 'Cao bao nhiêu', vidu: '这棵树多高？', dichnghia: 'Cây này cao bao nhiêu?' },
  { hanzi: '多重', pinyin: 'duō zhòng', hanviet: 'Đa trọng', nghia: 'Nặng bao nhiêu', vidu: '这个箱子多重？', dichnghia: 'Cái thùng này nặng bao nhiêu?' },
  { hanzi: '多公里', pinyin: 'duō gōnglǐ', hanviet: 'Đa công lý', nghia: 'Bao nhiêu km', vidu: '从这里到那儿有多公里？', dichnghia: 'Từ đây đến đó là bao nhiêu km?' },
  { hanzi: '米', pinyin: 'mǐ', hanviet: 'Mễ', nghia: 'Mét', vidu: '她身高一米七。', dichnghia: 'Cô ấy cao một mét bảy.' },
  { hanzi: '毕业', pinyin: 'bìyè', hanviet: 'Tốt nghiệp', nghia: 'Tốt nghiệp', vidu: '他今年大学毕业。', dichnghia: 'Anh ấy tốt nghiệp đại học năm nay.' },
  { hanzi: '决定', pinyin: 'juédìng', hanviet: 'Quyết định', nghia: 'Quyết định', vidu: '我决定明天开始学习。', dichnghia: 'Tôi quyết định bắt đầu học từ ngày mai.' },
  { hanzi: '鼠', pinyin: 'shǔ', hanviet: 'Thử', nghia: 'Chuột (con giáp)', vidu: '她属鼠。', dichnghia: 'Cô ấy tuổi Chuột.' },
  { hanzi: '牛', pinyin: 'niú', hanviet: 'Ngưu', nghia: 'Trâu/Bò (con giáp)', vidu: '我属牛。', dichnghia: 'Tôi tuổi Trâu/Bò.' },
  { hanzi: '虎', pinyin: 'hǔ', hanviet: 'Hổ', nghia: 'Hổ (con giáp)', vidu: '你属虎吗？', dichnghia: 'Bạn tuổi Hổ phải không?' },
  { hanzi: '兔', pinyin: 'tù', hanviet: 'Thố', nghia: 'Thỏ (con giáp)', vidu: '她的儿子属兔。', dichnghia: 'Con trai cô ấy tuổi Thỏ.' },
  { hanzi: '龙', pinyin: 'lóng', hanviet: 'Long', nghia: 'Rồng (con giáp)', vidu: '龙年快到了。', dichnghia: 'Sắp đến năm Rồng rồi.' },
  { hanzi: '蛇', pinyin: 'shé', hanviet: 'Xà', nghia: 'Rắn (con giáp)', vidu: '属蛇的人很聪明。', dichnghia: 'Người tuổi Rắn rất thông minh.' },
  { hanzi: '马', pinyin: 'mǎ', hanviet: 'Mã', nghia: 'Ngựa (con giáp)', vidu: '他属马。', dichnghia: 'Anh ấy tuổi Ngựa.' },
  { hanzi: '羊', pinyin: 'yáng', hanviet: 'Dương', nghia: 'Dê/Cừu (con giáp)', vidu: '你属羊还是属猴？', dichnghia: 'Bạn tuổi Dê/Cừu hay tuổi Khỉ?' },
  { hanzi: '猴', pinyin: 'hóu', hanviet: 'Hầu', nghia: 'Khỉ (con giáp)', vidu: '猴年吉祥。', dichnghia: 'Năm Khỉ cát tường.' },
  { hanzi: '鸡', pinyin: 'jī', hanviet: 'Kê', nghia: 'Gà (con giáp)', vidu: '她的外甥属鸡。', dichnghia: 'Cháu ngoại cô ấy tuổi Gà.' },
  { hanzi: '狗', pinyin: 'gǒu', hanviet: 'Cẩu', nghia: 'Chó (con giáp)', vidu: '我家里养了一条狗。', dichnghia: 'Nhà tôi nuôi một con chó.' },
  { hanzi: '猪', pinyin: 'zhū', hanviet: 'Trư', nghia: 'Lợn/Heo (con giáp)', vidu: '他属猪，很爱吃。', dichnghia: 'Anh ấy tuổi Lợn, rất thích ăn.' },
  { hanzi: '就', pinyin: 'jiù', hanviet: 'Tựu', nghia: 'Liền, thì, chính là', vidu: '你来了，我们就走吧。', dichnghia: 'Bạn đến rồi, chúng ta đi liền thôi.' },
  { hanzi: '新年', pinyin: 'xīnnián', hanviet: 'Tân niên', nghia: 'Năm mới', vidu: '祝你新年快乐！', dichnghia: 'Chúc bạn năm mới vui vẻ!' },
  { hanzi: '春节', pinyin: 'Chūnjié', hanviet: 'Xuân tiết', nghia: 'Tết Nguyên Đán (Tết Âm lịch)', vidu: '春节是中国最重要的节日。', dichnghia: 'Tết Nguyên Đán là ngày lễ quan trọng nhất của Trung Quốc.' },
  { hanzi: '节日', pinyin: 'jiérì', hanviet: 'Tiết nhật', nghia: 'Ngày lễ', vidu: '这个节日有什么习俗？', dichnghia: 'Ngày lễ này có tập tục gì?' },
  { hanzi: '圣诞节', pinyin: 'Shèngdànjié', hanviet: 'Thánh đản tiết', nghia: 'Lễ Giáng Sinh', vidu: '圣诞节那天会下雪吗？', dichnghia: 'Ngày Giáng Sinh có tuyết rơi không?' },
  { hanzi: '生日', pinyin: 'shēngrì', hanviet: 'Sinh nhật', nghia: 'Sinh nhật', vidu: '今天是我的生日。', dichnghia: 'Hôm nay là sinh nhật của tôi.' },
  { hanzi: '国庆节', pinyin: 'Guóqìngjié', hanviet: 'Quốc khánh tiết', nghia: 'Ngày Quốc Khánh', vidu: '国庆节我们放假七天。', dichnghia: 'Ngày Quốc Khánh chúng tôi được nghỉ 7 ngày.' },
  { hanzi: '中秋节', pinyin: 'Zhōngqiūjié', hanviet: 'Trung thu tiết', nghia: 'Tết Trung Thu', vidu: '中秋节我们吃月饼。', dichnghia: 'Tết Trung Thu chúng tôi ăn bánh trung thu.' },
  { hanzi: '教师节', pinyin: 'Jiàoshījié', hanviet: 'Giáo sư tiết', nghia: 'Ngày Nhà giáo', vidu: '我给老师送了教师节礼物。', dichnghia: 'Tôi đã tặng quà Ngày Nhà giáo cho cô giáo.' },
  { hanzi: '劳动节', pinyin: 'Láodòngjié', hanviet: 'Lao động tiết', nghia: 'Ngày Quốc tế Lao động (1/5)', vidu: '劳动节我们一起去旅行。', dichnghia: 'Ngày Quốc tế Lao động chúng tôi cùng nhau đi du lịch.' },
  { hanzi: '妇女节', pinyin: 'Fùnǚjié', hanviet: 'Phụ nữ tiết', nghia: 'Ngày Quốc tế Phụ nữ (8/3)', vidu: '妇女节要给妈妈买花。', dichnghia: 'Ngày Quốc tế Phụ nữ phải mua hoa tặng mẹ.' },
  { hanzi: '祝', pinyin: 'zhù', hanviet: 'Chúc', nghia: 'Chúc', vidu: '祝你一切顺利！', dichnghia: 'Chúc bạn mọi việc suôn sẻ!' },
  { hanzi: '正好', pinyin: 'zhènghǎo', hanviet: 'Chính hảo', nghia: 'Vừa đúng lúc, vừa hay', vidu: '你来得正好。', dichnghia: 'Bạn đến vừa đúng lúc.' },
  { hanzi: '打算', pinyin: 'dǎsuàn', hanviet: 'Đả toán', nghia: 'Dự định, tính toán', vidu: '你打算什么时候回家？', dichnghia: 'Bạn dự định khi nào về nhà?' },
  { hanzi: '参加', pinyin: 'cānjiā', hanviet: 'Tham gia', nghia: 'Tham gia', vidu: '我想参加这个活动。', dichnghia: 'Tôi muốn tham gia hoạt động này.' },
  { hanzi: '准备', pinyin: 'zhǔnbèi', hanviet: 'Chuẩn bị', nghia: 'Chuẩn bị', vidu: '我正在准备考试。', dichnghia: 'Tôi đang chuẩn bị cho kỳ thi.' },
  { hanzi: '举行', pinyin: 'jǔxíng', hanviet: 'Cử hành', nghia: 'Tổ chức (sự kiện, lễ hội)', vidu: '他们将举行一个派对。', dichnghia: 'Họ sẽ tổ chức một bữa tiệc.' },
  { hanzi: '晚会', pinyin: 'wǎnhuì', hanviet: 'Vãn hội', nghia: 'Buổi tối, dạ hội', vidu: '你参加今晚的晚会吗？', dichnghia: 'Bạn có tham gia buổi tối nay không?' },
  { hanzi: '蛋糕', pinyin: 'dàngāo', hanviet: 'Đản cao', nghia: 'Bánh kem, bánh ngọt', vidu: '这个蛋糕很好吃。', dichnghia: 'Cái bánh kem này rất ngon.' },
  { hanzi: '玩儿', pinyin: 'wánr', hanviet: 'Ngoạn nhi', nghia: 'Chơi', vidu: '我们一起去玩儿吧。', dichnghia: 'Chúng ta cùng nhau đi chơi đi.' },
  { hanzi: '玩具', pinyin: 'wánjù', hanviet: 'Ngoạn cụ', nghia: 'Đồ chơi', vidu: '孩子喜欢新的玩具。', dichnghia: 'Đứa trẻ thích đồ chơi mới.' }
];

        const flashcardContainer = document.getElementById('flashcard-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const jumpInput = document.getElementById('jump-input');
        const counter = document.getElementById('counter');

        let currentIndex = 0;
        let isTransitioning = false; 
        const totalCards = cardData.length;
        
        // Biến xử lý Vuốt (Swipe)
        let touchstartX = 0;
        let touchendX = 0;
        const SWIPE_THRESHOLD = 50; 
        
        jumpInput.max = totalCards;
        
        function renderCard(index) {
            const currentCard = cardData[index];
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            cardElement.id = 'flashcard-' + index;

            // Mặt trước: Chữ Hán, Simsun, Đen
            cardElement.innerHTML = `
                <div class="card__face card__face--front">${currentCard.hanzi}</div>
                <div class="card__face card__face--back">
                    <div class="back-content">
                        <p class="pinyin">${currentCard.pinyin}</p>
                        <p class="hanviet">${currentCard.hanviet}</p>
                        <p class="nghia">${currentCard.nghia}</p>
                        <p class="vidu-han">${currentCard.vidu}</p>
                        <p class="dichnghia">${currentCard.dichnghia}</p>
                    </div>
                </div>
            `;
            
            // Xử lý sự kiện lật thẻ
            cardElement.addEventListener('click', () => {
                if (!isTransitioning) {
                    cardElement.classList.toggle('is-flipped');
                }
            });

            // --- Logic Swipe ---
            cardElement.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, false);

            cardElement.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleGesture();
            }, false);
            
            return cardElement;
        }
        
        function updateDisplay() {
            counter.textContent = `${currentIndex + 1} / ${totalCards}`;
        }

        function changeCard(newIndex, direction) {
            if (isTransitioning || newIndex === currentIndex) {
                return;
            }

            if (newIndex < 0) {
                newIndex = totalCards - 1;
            } else if (newIndex >= totalCards) {
                newIndex = 0;
            }

            isTransitioning = true;
            const oldCard = document.getElementById('flashcard-' + currentIndex);
            const newCard = renderCard(newIndex);
            
            let slideDirection = direction;
            if (!slideDirection) {
                slideDirection = (newIndex > currentIndex || (currentIndex === totalCards - 1 && newIndex === 0)) ? 'next' : 'prev';
            }
            
            newCard.style.left = slideDirection === 'next' ? '100%' : '-100%';
            flashcardContainer.appendChild(newCard);
            
            if (oldCard) {
                oldCard.classList.add(slideDirection === 'next' ? 'slide-next-out' : 'slide-prev-out');
            }

            setTimeout(() => {
                newCard.style.left = '0';
            }, 50); 

            setTimeout(() => {
                if (oldCard) {
                    oldCard.remove();
                }
                currentIndex = newIndex;
                updateDisplay();
                isTransitioning = false;
            }, 400); 
        }
        
        function goToNextCard() {
            const newIndex = (currentIndex + 1) % totalCards;
            changeCard(newIndex, 'next');
        }

        function goToPrevCard() {
            const newIndex = (currentIndex - 1 + totalCards) % totalCards;
            changeCard(newIndex, 'prev');
        }
        
        function jumpToCard() {
            const inputValue = parseInt(jumpInput.value);
            
            if (isNaN(inputValue) || inputValue < 1 || inputValue > totalCards) {
                alert(`Lỗi: Vui lòng nhập số thẻ hợp lệ từ 1 đến ${totalCards}.`);
                jumpInput.value = "";
                return;
            }
            
            const newIndex = inputValue - 1;

            const direction = (newIndex > currentIndex) ? 'next' : 'prev';
            
            changeCard(newIndex, direction);

            jumpInput.value = "";
        }

        function handleGesture() {
            if (isTransitioning) return;
            const deltaX = touchendX - touchstartX;
            
            if (Math.abs(deltaX) > SWIPE_THRESHOLD) {
                if (deltaX < 0) {
                    goToNextCard();
                } else {
                    goToPrevCard();
                }
            }
        }

        prevBtn.addEventListener('click', goToPrevCard);
        nextBtn.addEventListener('click', goToNextCard);
        jumpBtn.addEventListener('click', jumpToCard);
        
        jumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                jumpToCard();
            }
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            flashcardContainer.appendChild(renderCard(currentIndex));
            updateDisplay();
        });

    </script>
</body>

</html>
