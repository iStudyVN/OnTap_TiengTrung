<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Tiếng Trung</title>
    <style>
        /* CSS để nhúng font Simsun */
        @font-face {
            font-family: 'Simsun';
            src: url(https://fonts.gstatic.com/s/simsun/v18/K9-BZD0b9T8xcP0Q.woff2) format('woff2');
            unicode-range: U+4E00-9FFF; /* Phạm vi cho ký tự Hán */
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .scene {
            width: 100%;
            height: 300px;
            perspective: 600px;
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            transition: 
                transform 0.6s, 
                opacity 0.3s, 
                left 0.4s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- HIỆU ỨNG TRƯỢT --- */
        .card.slide-next-out {
            transform: translateX(-100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card.slide-prev-out {
            transform: translateX(100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #ffffff;
        }

        /* YÊU CẦU: Mặt trước chữ Hán, font Simsun, màu đen, ở giữa */
        .card__face--front {
            font-family: 'Simsun', sans-serif; 
            font-size: 80px;
            color: #000000; /* Chữ màu đen */
        }

        .card__face--back {
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center; 
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
        }
        
        .back-content p {
            font-size: 1.3rem;
            margin: 8px 0;
            width: 100%;
            text-align: center; 
            font-weight: 500;
        }
        
        .back-content .pinyin { color: #e67e22; font-weight: bold; font-size: 1.6rem; } /* Màu cam */
        .back-content .hanviet { color: #8e44ad; } /* Màu tím */
        .back-content .nghia { color: #1f506b; font-style: italic; } /* Màu xanh đậm (thay vì #27ae60) */
        .back-content .vidu-han { color: #000000; font-family: 'Simsun', sans-serif; margin-top: 15px; font-size: 1.5rem; } /* Chữ Hán đen */
        .back-content .dichnghia { color: #000000; font-style: italic; font-size: 1rem; } /* Chữ đen */


        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-button {
            padding: 10px 20px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 0 5px;
        }

        .nav-button:hover {
            background-color: #2980b9;
        }
        
        #counter {
            font-size: 1.1rem;
            font-weight: bold;
            color: #7f8c8d;
            flex-grow: 1;
            text-align: center;
        }
        
        .jump-control {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        #jump-input {
            width: 60px;
            padding: 8px;
            border: 2px solid #3498db;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
        }
        
        .jump-button {
            background-color: #e74c3c; 
        }
        
        .jump-button:hover {
            background-color: #c0392b;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard Tiếng Trung</h1>
        <div class="scene">
            <div id="flashcard-container"></div>
        </div>
        <div class="navigation">
            <button class="nav-button" id="prev-btn">Trước</button>
            <span id="counter"></span>
            <button class="nav-button" id="next-btn">Sau</button>
        </div>
        
        <div class="jump-control">
            <input type="number" id="jump-input" min="1" max="30" placeholder="#">
            <button class="nav-button jump-button" id="jump-btn">Nhảy đến thẻ số</button>
        </div>
    </div>

    <script>
        // 30 từ vựng Hán ngữ giản thể được lấy từ shengci.txt
        const cardData_Dot6 = [
  { hanzi: '又...又...', pinyin: 'yòu... yòu...', hanviet: 'Hựu... hựu...', nghia: 'Vừa... vừa... (chỉ hai đặc điểm cùng tồn tại)', vidu: '这件衣服又漂亮又便宜。', dichnghia: 'Bộ quần áo này vừa đẹp vừa rẻ.' },
  { hanzi: '件', pinyin: 'jiàn', hanviet: 'Kiện', nghia: 'Cái, chiếc (lượng từ cho quần áo trên thân, sự việc)', vidu: '我买了一件大衣。', dichnghia: 'Tôi đã mua một chiếc áo khoác.' },
  { hanzi: '羽绒服', pinyin: 'yǔróngfú', hanviet: 'Vũ nhung phục', nghia: 'Áo khoác lông vũ', vidu: '冬天穿羽绒服很暖和。', dichnghia: 'Mặc áo khoác lông vũ rất ấm áp vào mùa đông.' },
  { hanzi: '大衣', pinyin: 'dàyī', hanviet: 'Đại y', nghia: 'Áo khoác, áo măng tô', vidu: '我有一件红色的大衣。', dichnghia: 'Tôi có một chiếc áo khoác màu đỏ.' },
  { hanzi: '裤子', pinyin: 'kùzi', hanviet: 'Khố tử', nghia: 'Quần', vidu: '这条裤子太长了。', dichnghia: 'Chiếc quần này quá dài rồi.' },
  { hanzi: '裙子', pinyin: 'qúnzi', hanviet: 'Quần tử', nghia: 'Váy, đầm', vidu: '她穿了一条漂亮的裙子。', dichnghia: 'Cô ấy mặc một chiếc váy rất đẹp.' },
  { hanzi: '上衣', pinyin: 'shàngyī', hanviet: 'Thượng y', nghia: 'Áo (quần áo mặc ở phần trên cơ thể)', vidu: '这件上衣很适合你。', dichnghia: 'Chiếc áo này rất hợp với bạn.' },
  { hanzi: '条', pinyin: 'tiáo', hanviet: 'Điều', nghia: 'Cây, chiếc (lượng từ cho vật dài, sông, đường)', vidu: '他买了一条新裤子。', dichnghia: 'Anh ấy mua một chiếc quần mới.' },
  { hanzi: '种', pinyin: 'zhǒng', hanviet: 'Chủng', nghia: 'Loại, chủng loại', vidu: '你喜欢哪种颜色？', dichnghia: 'Bạn thích loại màu nào?' },
  { hanzi: '干净', pinyin: 'gānjìng', hanviet: 'Can tịnh', nghia: 'Sạch sẽ', vidu: '请保持房间干净。', dichnghia: 'Xin giữ phòng sạch sẽ.' },
  { hanzi: '长', pinyin: 'cháng', hanviet: 'Trường', nghia: 'Dài', vidu: '她的头发很长。', dichnghia: 'Tóc cô ấy rất dài.' },
  { hanzi: '短', pinyin: 'duǎn', hanviet: 'Đoản', nghia: 'Ngắn', vidu: '我喜欢穿短裙。', dichnghia: 'Tôi thích mặc váy ngắn.' },
  { hanzi: '深', pinyin: 'shēn', hanviet: 'Thâm', nghia: 'Sâu, đậm (màu)', vidu: '这件衣服颜色太深了。', dichnghia: 'Màu của bộ quần áo này quá đậm.' },
  { hanzi: '浅', pinyin: 'qiǎn', hanviet: 'Thiển', nghia: 'Nông, nhạt (màu)', vidu: '我更喜欢浅色的。', dichnghia: 'Tôi thích màu nhạt hơn.' },
  { hanzi: '肥', pinyin: 'féi', hanviet: 'Phì', nghia: 'Béo, mập; rộng, thùng thình (quần áo)', vidu: '这条裤子有点肥。', dichnghia: 'Chiếc quần này hơi rộng.' },
  { hanzi: '胖', pinyin: 'pàng', hanviet: 'Bàn', nghia: 'Béo, mập', vidu: '她比以前胖了一点。', dichnghia: 'Cô ấy mập hơn trước một chút.' },
  { hanzi: '瘦', pinyin: 'shòu', hanviet: 'Sấu', nghia: 'Gầy, ốm; chật, ôm sát (quần áo)', vidu: '你最近瘦了很多。', dichnghia: 'Gần đây bạn gầy đi rất nhiều.' },
  { hanzi: '减肥', pinyin: 'jiǎnféi', hanviet: 'Giảm phì', nghia: 'Giảm cân', vidu: '她正在努力减肥。', dichnghia: 'Cô ấy đang nỗ lực giảm cân.' },
  { hanzi: '试', pinyin: 'shì', hanviet: 'Thí', nghia: 'Thử, thử nghiệm', vidu: '你可以试穿一下。', dichnghia: 'Bạn có thể thử mặc một chút.' },
  { hanzi: '试试', pinyin: 'shìshi', hanviet: 'Thí thí', nghia: 'Thử một chút', vidu: '我想试试这件衣服。', dichnghia: 'Tôi muốn thử chiếc áo này.' },
  { hanzi: '当然', pinyin: 'dāngrán', hanviet: 'Đương nhiên', nghia: 'Đương nhiên, dĩ nhiên', vidu: '你当然可以来。', dichnghia: 'Đương nhiên bạn có thể đến.' },
  { hanzi: '合', pinyin: 'hé', hanviet: 'Hợp', nghia: 'Hợp, vừa (quần áo)', vidu: '这双鞋很合脚。', dichnghia: 'Đôi giày này rất vừa chân.' },
  { hanzi: '适合', pinyin: 'shìhé', hanviet: 'Thích hợp', nghia: 'Thích hợp, phù hợp', vidu: '这份工作很适合你。', dichnghia: 'Công việc này rất phù hợp với bạn.' },
  { hanzi: '打折', pinyin: 'dǎzhé', hanviet: 'Đả chiết', nghia: 'Giảm giá, chiết khấu', vidu: '这个商店经常打折。', dichnghia: 'Cửa hàng này thường xuyên giảm giá.' },
  { hanzi: '好吃', pinyin: 'hǎochī', hanviet: 'Hảo cật', nghia: 'Ngon (đồ ăn)', vidu: '这个菜很好吃。', dichnghia: 'Món ăn này rất ngon.' },
  { hanzi: '好喝', pinyin: 'hǎohē', hanviet: 'Hảo hát', nghia: 'Ngon (thức uống)', vidu: '这种茶很好喝。', dichnghia: 'Loại trà này rất ngon.' },
  { hanzi: '好听', pinyin: 'hǎotīng', hanviet: 'Hảo thính', nghia: 'Hay (âm thanh, giọng nói)', vidu: '这首歌很好听。', dichnghia: 'Bài hát này rất hay.' },
  { hanzi: '好看', pinyin: 'hǎokàn', hanviet: 'Hảo khán', nghia: 'Đẹp, hay (phim, sách)', vidu: '这部电影很好看。', dichnghia: 'Bộ phim này rất hay.' }
];

        const flashcardContainer = document.getElementById('flashcard-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const jumpInput = document.getElementById('jump-input');
        const counter = document.getElementById('counter');

        let currentIndex = 0;
        let isTransitioning = false; 
        const totalCards = cardData.length;
        
        // Biến xử lý Vuốt (Swipe)
        let touchstartX = 0;
        let touchendX = 0;
        const SWIPE_THRESHOLD = 50; 
        
        jumpInput.max = totalCards;
        
        function renderCard(index) {
            const currentCard = cardData[index];
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            cardElement.id = 'flashcard-' + index;

            // Mặt trước: Chữ Hán, Simsun, Đen
            cardElement.innerHTML = `
                <div class="card__face card__face--front">${currentCard.hanzi}</div>
                <div class="card__face card__face--back">
                    <div class="back-content">
                        <p class="pinyin">${currentCard.pinyin}</p>
                        <p class="hanviet">${currentCard.hanviet}</p>
                        <p class="nghia">${currentCard.nghia}</p>
                        <p class="vidu-han">${currentCard.vidu}</p>
                        <p class="dichnghia">${currentCard.dichnghia}</p>
                    </div>
                </div>
            `;
            
            // Xử lý sự kiện lật thẻ
            cardElement.addEventListener('click', () => {
                if (!isTransitioning) {
                    cardElement.classList.toggle('is-flipped');
                }
            });

            // --- Logic Swipe ---
            cardElement.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, false);

            cardElement.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleGesture();
            }, false);
            
            return cardElement;
        }
        
        function updateDisplay() {
            counter.textContent = `${currentIndex + 1} / ${totalCards}`;
        }

        function changeCard(newIndex, direction) {
            if (isTransitioning || newIndex === currentIndex) {
                return;
            }

            if (newIndex < 0) {
                newIndex = totalCards - 1;
            } else if (newIndex >= totalCards) {
                newIndex = 0;
            }

            isTransitioning = true;
            const oldCard = document.getElementById('flashcard-' + currentIndex);
            const newCard = renderCard(newIndex);
            
            let slideDirection = direction;
            if (!slideDirection) {
                slideDirection = (newIndex > currentIndex || (currentIndex === totalCards - 1 && newIndex === 0)) ? 'next' : 'prev';
            }
            
            newCard.style.left = slideDirection === 'next' ? '100%' : '-100%';
            flashcardContainer.appendChild(newCard);
            
            if (oldCard) {
                oldCard.classList.add(slideDirection === 'next' ? 'slide-next-out' : 'slide-prev-out');
            }

            setTimeout(() => {
                newCard.style.left = '0';
            }, 50); 

            setTimeout(() => {
                if (oldCard) {
                    oldCard.remove();
                }
                currentIndex = newIndex;
                updateDisplay();
                isTransitioning = false;
            }, 400); 
        }
        
        function goToNextCard() {
            const newIndex = (currentIndex + 1) % totalCards;
            changeCard(newIndex, 'next');
        }

        function goToPrevCard() {
            const newIndex = (currentIndex - 1 + totalCards) % totalCards;
            changeCard(newIndex, 'prev');
        }
        
        function jumpToCard() {
            const inputValue = parseInt(jumpInput.value);
            
            if (isNaN(inputValue) || inputValue < 1 || inputValue > totalCards) {
                alert(`Lỗi: Vui lòng nhập số thẻ hợp lệ từ 1 đến ${totalCards}.`);
                jumpInput.value = "";
                return;
            }
            
            const newIndex = inputValue - 1;

            const direction = (newIndex > currentIndex) ? 'next' : 'prev';
            
            changeCard(newIndex, direction);

            jumpInput.value = "";
        }

        function handleGesture() {
            if (isTransitioning) return;
            const deltaX = touchendX - touchstartX;
            
            if (Math.abs(deltaX) > SWIPE_THRESHOLD) {
                if (deltaX < 0) {
                    goToNextCard();
                } else {
                    goToPrevCard();
                }
            }
        }

        prevBtn.addEventListener('click', goToPrevCard);
        nextBtn.addEventListener('click', goToNextCard);
        jumpBtn.addEventListener('click', jumpToCard);
        
        jumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                jumpToCard();
            }
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            flashcardContainer.appendChild(renderCard(currentIndex));
            updateDisplay();
        });

    </script>
</body>

</html>
