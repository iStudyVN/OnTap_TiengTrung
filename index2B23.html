<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Tiếng Trung</title>
    <style>
        /* CSS để nhúng font Simsun */
        @font-face {
            font-family: 'Simsun';
            src: url(https://fonts.gstatic.com/s/simsun/v18/K9-BZD0b9T8xcP0Q.woff2) format('woff2');
            unicode-range: U+4E00-9FFF; /* Phạm vi cho ký tự Hán */
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .scene {
            width: 100%;
            height: 300px;
            perspective: 600px;
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            transition: 
                transform 0.6s, 
                opacity 0.3s, 
                left 0.4s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- HIỆU ỨNG TRƯỢT --- */
        .card.slide-next-out {
            transform: translateX(-100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card.slide-prev-out {
            transform: translateX(100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #ffffff;
        }

        /* YÊU CẦU: Mặt trước chữ Hán, font Simsun, màu đen, ở giữa */
        .card__face--front {
            font-family: 'Simsun', sans-serif; 
            font-size: 80px;
            color: #000000; /* Chữ màu đen */
        }

        .card__face--back {
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center; 
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
        }
        
        .back-content p {
            font-size: 1.3rem;
            margin: 8px 0;
            width: 100%;
            text-align: center; 
            font-weight: 500;
        }
        
        .back-content .pinyin { color: #e67e22; font-weight: bold; font-size: 1.6rem; } /* Màu cam */
        .back-content .hanviet { color: #8e44ad; } /* Màu tím */
        .back-content .nghia { color: #1f506b; font-style: italic; } /* Màu xanh đậm (thay vì #27ae60) */
        .back-content .vidu-han { color: #000000; font-family: 'Simsun', sans-serif; margin-top: 15px; font-size: 1.5rem; } /* Chữ Hán đen */
        .back-content .dichnghia { color: #000000; font-style: italic; font-size: 1rem; } /* Chữ đen */


        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-button {
            padding: 10px 20px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 0 5px;
        }

        .nav-button:hover {
            background-color: #2980b9;
        }
        
        #counter {
            font-size: 1.1rem;
            font-weight: bold;
            color: #7f8c8d;
            flex-grow: 1;
            text-align: center;
        }
        
        .jump-control {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        #jump-input {
            width: 60px;
            padding: 8px;
            border: 2px solid #3498db;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
        }
        
        .jump-button {
            background-color: #e74c3c; 
        }
        
        .jump-button:hover {
            background-color: #c0392b;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard Tiếng Trung</h1>
        <div class="scene">
            <div id="flashcard-container"></div>
        </div>
        <div class="navigation">
            <button class="nav-button" id="prev-btn">Trước</button>
            <span id="counter"></span>
            <button class="nav-button" id="next-btn">Sau</button>
        </div>
        
        <div class="jump-control">
            <input type="number" id="jump-input" min="1" max="30" placeholder="#">
            <button class="nav-button jump-button" id="jump-btn">Nhảy đến thẻ số</button>
        </div>
    </div>

    <script>
        // 30 từ vựng Hán ngữ giản thể được lấy từ shengci.txt
       const cardData_Dot9_B = [
  { hanzi: '东边', pinyin: 'dōngbian', hanviet: 'Đông biên', nghia: 'Phía Đông', vidu: '太阳从东边升起。', dichnghia: 'Mặt trời mọc từ phía Đông.' },
  { hanzi: '西边', pinyin: 'xībian', hanviet: 'Tây biên', nghia: 'Phía Tây', vidu: '西边有一座山。', dichnghia: 'Có một ngọn núi ở phía Tây.' },
  { hanzi: '南边', pinyin: 'nánbian', hanviet: 'Nam biên', nghia: 'Phía Nam', vidu: '我们学校在城市南边。', dichnghia: 'Trường học của chúng tôi ở phía Nam thành phố.' },
  { hanzi: '北边', pinyin: 'běibian', hanviet: 'Bắc biên', nghia: 'Phía Bắc', vidu: '北边冬天很冷。', dichnghia: 'Phía Bắc mùa đông rất lạnh.' },
  { hanzi: '前边', pinyin: 'qiánbian', hanviet: 'Tiền biên', nghia: 'Phía trước', vidu: '请看前边。', dichnghia: 'Xin hãy nhìn phía trước.' },
  { hanzi: '后边', pinyin: 'hòubian', hanviet: 'Hậu biên', nghia: 'Phía sau', vidu: '他的车停在后边。', dichnghia: 'Xe của anh ấy đỗ ở phía sau.' },
  { hanzi: '左边', pinyin: 'zuǒbian', hanviet: 'Tả biên', nghia: 'Bên trái', vidu: '请往左边走。', dichnghia: 'Xin hãy đi về phía bên trái.' },
  { hanzi: '右边', pinyin: 'yòubian', hanviet: 'Hữu biên', nghia: 'Bên phải', vidu: '出口在右边。', dichnghia: 'Lối ra ở bên phải.' },
  { hanzi: '里边', pinyin: 'lǐbian', hanviet: 'Lí biên', nghia: 'Bên trong', vidu: '书包里边有什么？', dichnghia: 'Trong cặp sách có gì?' },
  { hanzi: '外边', pinyin: 'wàibian', hanviet: 'Ngoại biên', nghia: 'Bên ngoài', vidu: '外面下雨了。', dichnghia: 'Bên ngoài trời mưa rồi.' },
  { hanzi: '上边', pinyin: 'shàngbian', hanviet: 'Thượng biên', nghia: 'Bên trên', vidu: '书在上边。', dichnghia: 'Sách ở bên trên.' },
  { hanzi: '下边', pinyin: 'xiàbian', hanviet: 'Hạ biên', nghia: 'Bên dưới', vidu: '球在桌子下边。', dichnghia: 'Quả bóng ở bên dưới cái bàn.' },
  { hanzi: '离', pinyin: 'lí', hanviet: 'Li', nghia: 'Cách, ly (khoảng cách)', vidu: '我家离学校很近。', dichnghia: 'Nhà tôi cách trường rất gần.' },
  { hanzi: '远', pinyin: 'yuǎn', hanviet: 'Viễn', nghia: 'Xa', vidu: '这儿离市中心远吗？', dichnghia: 'Ở đây cách trung tâm thành phố xa không?' },
  { hanzi: '近', pinyin: 'jìn', hanviet: 'Cận', nghia: 'Gần', vidu: '他住在附近。', dichnghia: 'Anh ấy sống ở gần đây.' },
  { hanzi: '地方', pinyin: 'dìfang', hanviet: 'Địa phương', nghia: 'Nơi, chỗ', vidu: '这是一个好地方。', dichnghia: 'Đây là một nơi tốt.' },
  { hanzi: '足球场', pinyin: 'zúqiúchǎng', hanviet: 'Túc cầu trường', nghia: 'Sân bóng đá', vidu: '他们在足球场踢球。', dichnghia: 'Họ đang đá bóng ở sân bóng đá.' },
  { hanzi: '足球', pinyin: 'zúqiú', hanviet: 'Túc cầu', nghia: 'Bóng đá', vidu: '他很喜欢足球。', dichnghia: 'Anh ấy rất thích bóng đá.' },
  { hanzi: '踢', pinyin: 'tī', hanviet: 'Thích', nghia: 'Đá, sút', vidu: '我们去踢足球吧。', dichnghia: 'Chúng ta đi đá bóng đi.' },
  { hanzi: '旁边', pinyin: 'pángbiān', hanviet: 'Bàng biên', nghia: 'Bên cạnh', vidu: '银行在邮局旁边。', dichnghia: 'Ngân hàng ở bên cạnh bưu điện.' },
  { hanzi: '打听', pinyin: 'dǎtīng', hanviet: 'Đả thính', nghia: 'Hỏi thăm, dò hỏi', vidu: '我打听一下路。', dichnghia: 'Tôi hỏi thăm đường một chút.' },
  { hanzi: '博物馆', pinyin: 'bówùguǎn', hanviet: 'Bác vật quán', nghia: 'Bảo tàng', vidu: '你参观过这个博物馆吗？', dichnghia: 'Bạn đã tham quan bảo tàng này chưa?' },
  { hanzi: '和平', pinyin: 'hépíng', hanviet: 'Hòa bình', nghia: 'Hòa bình', vidu: '人们渴望和平。', dichnghia: 'Mọi người khao khát hòa bình.' },
  { hanzi: '广场', pinyin: 'guǎngchǎng', hanviet: 'Quảng trường', nghia: 'Quảng trường', vidu: '广场上很多人。', dichnghia: 'Có rất nhiều người trên quảng trường.' },
  { hanzi: '中间', pinyin: 'zhōngjiān', hanviet: 'Trung gian', nghia: 'Ở giữa, trung gian', vidu: '请坐在我们中间。', dichnghia: 'Xin mời ngồi ở giữa chúng tôi.' },
  { hanzi: '从', pinyin: 'cóng', hanviet: 'Tòng', nghia: 'Từ (chỉ nguồn gốc, điểm bắt đầu)', vidu: '他从北京来。', dichnghia: 'Anh ấy đến từ Bắc Kinh.' },
  { hanzi: '到', pinyin: 'dào', hanviet: 'Đáo', nghia: 'Đến (chỉ đích đến)', vidu: '我们到学校了。', dichnghia: 'Chúng ta đã đến trường rồi.' },
  { hanzi: '来', pinyin: 'lái', hanviet: 'Lai', nghia: 'Đến, lại (xu hướng gần người nói)', vidu: '你快来我家吧。', dichnghia: 'Bạn mau đến nhà tôi đi.' },
  { hanzi: '一直', pinyin: 'yīzhí', hanviet: 'Nhất trực', nghia: 'Luôn luôn, thẳng (hướng đi)', vidu: '请一直往前走。', dichnghia: 'Xin hãy đi thẳng về phía trước.' },
  { hanzi: '红绿灯', pinyin: 'hónglǜdēng', hanviet: 'Hồng lục đăng', nghia: 'Đèn giao thông', vidu: '红绿灯亮了。', dichnghia: 'Đèn giao thông sáng rồi.' },
  { hanzi: '往', pinyin: 'wǎng', hanviet: 'Vãng', nghia: 'Về phía, hướng về', vidu: '往右拐。', dichnghia: 'Rẽ về phía bên phải.' },
  { hanzi: '拐', pinyin: 'guǎi', hanviet: 'Quải', nghia: 'Rẽ, ngoặt', vidu: '在路口拐弯。', dichnghia: 'Rẽ ở ngã tư.' },
  { hanzi: '转', pinyin: 'zhuǎn', hanviet: 'Chuyển', nghia: 'Quay, xoay, chuyển', vidu: '向左转。', dichnghia: 'Quay sang bên trái.' },
  { hanzi: '马路', pinyin: 'mǎlù', hanviet: 'Mã lộ', nghia: 'Đường cái, mặt đường', vidu: '请过马路时小心。', dichnghia: 'Xin hãy cẩn thận khi qua đường.' },
  { hanzi: '座', pinyin: 'zuò', hanviet: 'Tọa', nghia: 'Tòa, ngọn (lượng từ cho nhà cửa, núi)', vidu: '这座楼很高。', dichnghia: 'Tòa nhà này rất cao.' },
  { hanzi: '白色', pinyin: 'báisè', hanviet: 'Bạch sắc', nghia: 'Màu trắng', vidu: '我喜欢白色。', dichnghia: 'Tôi thích màu trắng.' }
];
        const flashcardContainer = document.getElementById('flashcard-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const jumpInput = document.getElementById('jump-input');
        const counter = document.getElementById('counter');

        let currentIndex = 0;
        let isTransitioning = false; 
        const totalCards = cardData.length;
        
        // Biến xử lý Vuốt (Swipe)
        let touchstartX = 0;
        let touchendX = 0;
        const SWIPE_THRESHOLD = 50; 
        
        jumpInput.max = totalCards;
        
        function renderCard(index) {
            const currentCard = cardData[index];
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            cardElement.id = 'flashcard-' + index;

            // Mặt trước: Chữ Hán, Simsun, Đen
            cardElement.innerHTML = `
                <div class="card__face card__face--front">${currentCard.hanzi}</div>
                <div class="card__face card__face--back">
                    <div class="back-content">
                        <p class="pinyin">${currentCard.pinyin}</p>
                        <p class="hanviet">${currentCard.hanviet}</p>
                        <p class="nghia">${currentCard.nghia}</p>
                        <p class="vidu-han">${currentCard.vidu}</p>
                        <p class="dichnghia">${currentCard.dichnghia}</p>
                    </div>
                </div>
            `;
            
            // Xử lý sự kiện lật thẻ
            cardElement.addEventListener('click', () => {
                if (!isTransitioning) {
                    cardElement.classList.toggle('is-flipped');
                }
            });

            // --- Logic Swipe ---
            cardElement.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, false);

            cardElement.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleGesture();
            }, false);
            
            return cardElement;
        }
        
        function updateDisplay() {
            counter.textContent = `${currentIndex + 1} / ${totalCards}`;
        }

        function changeCard(newIndex, direction) {
            if (isTransitioning || newIndex === currentIndex) {
                return;
            }

            if (newIndex < 0) {
                newIndex = totalCards - 1;
            } else if (newIndex >= totalCards) {
                newIndex = 0;
            }

            isTransitioning = true;
            const oldCard = document.getElementById('flashcard-' + currentIndex);
            const newCard = renderCard(newIndex);
            
            let slideDirection = direction;
            if (!slideDirection) {
                slideDirection = (newIndex > currentIndex || (currentIndex === totalCards - 1 && newIndex === 0)) ? 'next' : 'prev';
            }
            
            newCard.style.left = slideDirection === 'next' ? '100%' : '-100%';
            flashcardContainer.appendChild(newCard);
            
            if (oldCard) {
                oldCard.classList.add(slideDirection === 'next' ? 'slide-next-out' : 'slide-prev-out');
            }

            setTimeout(() => {
                newCard.style.left = '0';
            }, 50); 

            setTimeout(() => {
                if (oldCard) {
                    oldCard.remove();
                }
                currentIndex = newIndex;
                updateDisplay();
                isTransitioning = false;
            }, 400); 
        }
        
        function goToNextCard() {
            const newIndex = (currentIndex + 1) % totalCards;
            changeCard(newIndex, 'next');
        }

        function goToPrevCard() {
            const newIndex = (currentIndex - 1 + totalCards) % totalCards;
            changeCard(newIndex, 'prev');
        }
        
        function jumpToCard() {
            const inputValue = parseInt(jumpInput.value);
            
            if (isNaN(inputValue) || inputValue < 1 || inputValue > totalCards) {
                alert(`Lỗi: Vui lòng nhập số thẻ hợp lệ từ 1 đến ${totalCards}.`);
                jumpInput.value = "";
                return;
            }
            
            const newIndex = inputValue - 1;

            const direction = (newIndex > currentIndex) ? 'next' : 'prev';
            
            changeCard(newIndex, direction);

            jumpInput.value = "";
        }

        function handleGesture() {
            if (isTransitioning) return;
            const deltaX = touchendX - touchstartX;
            
            if (Math.abs(deltaX) > SWIPE_THRESHOLD) {
                if (deltaX < 0) {
                    goToNextCard();
                } else {
                    goToPrevCard();
                }
            }
        }

        prevBtn.addEventListener('click', goToPrevCard);
        nextBtn.addEventListener('click', goToNextCard);
        jumpBtn.addEventListener('click', jumpToCard);
        
        jumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                jumpToCard();
            }
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            flashcardContainer.appendChild(renderCard(currentIndex));
            updateDisplay();
        });

    </script>
</body>

</html>
