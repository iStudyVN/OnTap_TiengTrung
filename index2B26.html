<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Tiếng Trung</title>
    <style>
        /* CSS để nhúng font Simsun */
        @font-face {
            font-family: 'Simsun';
            src: url(https://fonts.gstatic.com/s/simsun/v18/K9-BZD0b9T8xcP0Q.woff2) format('woff2');
            unicode-range: U+4E00-9FFF; /* Phạm vi cho ký tự Hán */
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .scene {
            width: 100%;
            height: 300px;
            perspective: 600px;
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            transition: 
                transform 0.6s, 
                opacity 0.3s, 
                left 0.4s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- HIỆU ỨNG TRƯỢT --- */
        .card.slide-next-out {
            transform: translateX(-100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card.slide-prev-out {
            transform: translateX(100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #ffffff;
        }

        /* YÊU CẦU: Mặt trước chữ Hán, font Simsun, màu đen, ở giữa */
        .card__face--front {
            font-family: 'Simsun', sans-serif; 
            font-size: 80px;
            color: #000000; /* Chữ màu đen */
        }

        .card__face--back {
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center; 
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
        }
        
        .back-content p {
            font-size: 1.3rem;
            margin: 8px 0;
            width: 100%;
            text-align: center; 
            font-weight: 500;
        }
        
        .back-content .pinyin { color: #e67e22; font-weight: bold; font-size: 1.6rem; } /* Màu cam */
        .back-content .hanviet { color: #8e44ad; } /* Màu tím */
        .back-content .nghia { color: #1f506b; font-style: italic; } /* Màu xanh đậm (thay vì #27ae60) */
        .back-content .vidu-han { color: #000000; font-family: 'Simsun', sans-serif; margin-top: 15px; font-size: 1.5rem; } /* Chữ Hán đen */
        .back-content .dichnghia { color: #000000; font-style: italic; font-size: 1rem; } /* Chữ đen */


        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-button {
            padding: 10px 20px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 0 5px;
        }

        .nav-button:hover {
            background-color: #2980b9;
        }
        
        #counter {
            font-size: 1.1rem;
            font-weight: bold;
            color: #7f8c8d;
            flex-grow: 1;
            text-align: center;
        }
        
        .jump-control {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        #jump-input {
            width: 60px;
            padding: 8px;
            border: 2px solid #3498db;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
        }
        
        .jump-button {
            background-color: #e74c3c; 
        }
        
        .jump-button:hover {
            background-color: #c0392b;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard Tiếng Trung</h1>
        <div class="scene">
            <div id="flashcard-container"></div>
        </div>
        <div class="navigation">
            <button class="nav-button" id="prev-btn">Trước</button>
            <span id="counter"></span>
            <button class="nav-button" id="next-btn">Sau</button>
        </div>
        
        <div class="jump-control">
            <input type="number" id="jump-input" min="1" max="30" placeholder="#">
            <button class="nav-button jump-button" id="jump-btn">Nhảy đến thẻ số</button>
        </div>
    </div>

    <script>
        // 30 từ vựng Hán ngữ giản thể được lấy từ shengci.txt
        const cardData = [
  { hanzi: '喂', pinyin: 'wèi', hanviet: 'Uy', nghia: 'A lô (khi nghe điện thoại); Này!', vidu: '喂，你是哪位？', dichnghia: 'A lô, bạn là ai đấy?' },
  { hanzi: '阿姨', pinyin: 'āyí', hanviet: 'A Di', nghia: 'Dì, cô (gọi phụ nữ trung niên)', vidu: '阿姨好，您去哪儿？', dichnghia: 'Chào cô, cô đi đâu đấy ạ?' },
  { hanzi: '中学', pinyin: 'zhōngxué', hanviet: 'Trung Học', nghia: 'Trường trung học', vidu: '我弟弟在中学学习。', dichnghia: 'Em trai tôi học ở trường trung học.' },
  { hanzi: '出国', pinyin: 'chū guó', hanviet: 'Xuất Quốc', nghia: 'Ra nước ngoài', vidu: '她明年打算出国留学。', dichnghia: 'Cô ấy dự định ra nước ngoài du học vào năm sau.' },
  { hanzi: '关机', pinyin: 'guān jī', hanviet: 'Quan Cơ', nghia: 'Tắt máy (điện thoại, thiết bị)', vidu: '请把手机关机。', dichnghia: 'Xin hãy tắt máy điện thoại.' },
  { hanzi: '忘', pinyin: 'wàng', hanviet: 'Vong', nghia: 'Quên', vidu: '我忘带钥匙了。', dichnghia: 'Tôi quên mang theo chìa khóa rồi.' },
  { hanzi: '开机', pinyin: 'kāi jī', hanviet: 'Khai Cơ', nghia: 'Mở máy, khởi động (điện thoại, thiết bị)', vidu: '你为什么不开机？', dichnghia: 'Tại sao bạn không mở máy?' },
  { hanzi: '又', pinyin: 'yòu', hanviet: 'Hựu', nghia: 'Lại, nữa (hành động lặp lại)', vidu: '他今天又迟到了。', dichnghia: 'Hôm nay anh ấy lại đến muộn rồi.' },
  { hanzi: '响', pinyin: 'xiǎng', hanviet: 'Hưởng', nghia: 'Kêu, reo (chuông)', vidu: '你的手机在响。', dichnghia: 'Điện thoại của bạn đang reo.' },
  { hanzi: '接', pinyin: 'jiē', hanviet: 'Tiếp', nghia: 'Nhận, nghe (điện thoại); đón', vidu: '请接电话！', dichnghia: 'Xin nghe điện thoại!' },
  { hanzi: '踢', pinyin: 'tī', hanviet: 'Thích', nghia: 'Đá (bóng)', vidu: '他们正在踢足球。', dichnghia: 'Họ đang đá bóng đá.' },
  { hanzi: '比赛', pinyin: 'bǐsài', hanviet: 'Bỉ Tái', nghia: 'Thi đấu, trận đấu', vidu: '昨天的比赛很精彩。', dichnghia: 'Trận đấu hôm qua rất hấp dẫn.' },
  { hanzi: '队', pinyin: 'duì', hanviet: 'Đội', nghia: 'Đội, hàng', vidu: '我们队赢了。', dichnghia: 'Đội chúng tôi thắng rồi.' },
  { hanzi: '输', pinyin: 'shū', hanviet: 'Thâu', nghia: 'Thua', vidu: '他们输了一场比赛。', dichnghia: 'Họ đã thua một trận đấu.' },
  { hanzi: '赢', pinyin: 'yíng', hanviet: 'Doanh', nghia: 'Thắng', vidu: '我们终于赢了！', dichnghia: 'Cuối cùng chúng tôi cũng thắng rồi!' },
  { hanzi: '比', pinyin: 'bǐ', hanviet: 'Bỉ', nghia: 'So sánh, tỉ số (trong thi đấu)', vidu: '最后比分是二比一。', dichnghia: 'Tỉ số cuối cùng là 2 so với 1 (2-1).' },
  { hanzi: '祝贺', pinyin: 'zhùhè', hanviet: 'Chúc Hạ', nghia: 'Chúc mừng', vidu: '我祝贺你成功！', dichnghia: 'Tôi chúc mừng bạn thành công!' },
  { hanzi: '托福', pinyin: 'Tuōfú', hanviet: 'Thác Phúc', nghia: 'TOEFL (tên kỳ thi tiếng Anh)', vidu: 'Cô ấy đang chuẩn bị cho kỳ thi TOEFL.', dichnghia: 'Cô ấy đang chuẩn bị cho kỳ thi TOEFL.' },
  { hanzi: 'đã', pinyin: 'yǐjīng', hanviet: 'Dĩ Kinh', nghia: 'Đã, rồi', vidu: '他已经走了。', dichnghia: 'Anh ấy đã đi rồi.' },
  { hanzi: '考', pinyin: 'kǎo', hanviet: 'Khảo', nghia: 'Thi, kiểm tra', vidu: '你考得怎么样？', dichnghia: 'Bạn thi thế nào?' },
  { hanzi: '陪', pinyin: 'péi', hanviet: 'Bồi', nghia: 'Cùng, ở bên, đi cùng', vidu: '我陪你去医院。', dichnghia: 'Tôi đi cùng bạn đến bệnh viện.' },
  { hanzi: '满分', pinyin: 'mǎnfēn', hanviet: 'Mãn Phân', nghia: 'Điểm tuyệt đối, điểm tối đa', vidu: 'Cô ấy đạt điểm tuyệt đối trong kỳ thi lần này.', dichnghia: 'Cô ấy đạt điểm tuyệt đối trong kỳ thi lần này.' },
  { hanzi: '奖学金', pinyin: 'jiǎngxuéjīn', hanviet: 'Tưởng Học Kim', nghia: 'Học bổng', vidu: 'Anh ấy đã nhận được học bổng toàn phần.', dichnghia: 'Anh ấy đã nhận được học bổng toàn phần.' },
  { hanzi: '送行', pinyin: 'sòngxíng', hanviet: 'Tống Hành', nghia: 'Tiễn (người đi xa)', vidu: 'Bạn bè đến sân bay tiễn tôi.', dichnghia: 'Bạn bè đến sân bay tiễn tôi.' },
  { hanzi: '见面', pinyin: 'jiàn miàn', hanviet: 'Kiến Diện', nghia: 'Gặp mặt', vidu: 'Chúng tôi hẹn gặp mặt vào ngày mai.', dichnghia: 'Chúng tôi hẹn gặp mặt vào ngày mai.' },
  { hanzi: 'pre-chúc', pinyin: 'yùzhù', hanviet: 'Dự Chúc', nghia: 'Chúc trước, chúc sớm', vidu: 'Chúc bạn trước trận đấu thành công!', dichnghia: 'Chúc bạn trước trận đấu thành công!' },
  { hanzi: 'thành công', pinyin: 'chénggōng', hanviet: 'Thành Công', nghia: 'Thành công', vidu: 'Cuối cùng cô ấy cũng thành công rồi.', dichnghia: 'Cuối cùng cô ấy cũng thành công rồi.' },
  { hanzi: 'khóc', pinyin: 'kū', hanviet: 'Khốc', nghia: 'Khóc', vidu: 'Đừng khóc nữa, mọi chuyện sẽ ổn thôi。', dichnghia: 'Đừng khóc nữa, mọi chuyện sẽ ổn thôi.' }
];


        const flashcardContainer = document.getElementById('flashcard-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const jumpInput = document.getElementById('jump-input');
        const counter = document.getElementById('counter');

        let currentIndex = 0;
        let isTransitioning = false; 
        const totalCards = cardData.length;
        
        // Biến xử lý Vuốt (Swipe)
        let touchstartX = 0;
        let touchendX = 0;
        const SWIPE_THRESHOLD = 50; 
        
        jumpInput.max = totalCards;
        
        function renderCard(index) {
            const currentCard = cardData[index];
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            cardElement.id = 'flashcard-' + index;

            // Mặt trước: Chữ Hán, Simsun, Đen
            cardElement.innerHTML = `
                <div class="card__face card__face--front">${currentCard.hanzi}</div>
                <div class="card__face card__face--back">
                    <div class="back-content">
                        <p class="pinyin">${currentCard.pinyin}</p>
                        <p class="hanviet">${currentCard.hanviet}</p>
                        <p class="nghia">${currentCard.nghia}</p>
                        <p class="vidu-han">${currentCard.vidu}</p>
                        <p class="dichnghia">${currentCard.dichnghia}</p>
                    </div>
                </div>
            `;
            
            // Xử lý sự kiện lật thẻ
            cardElement.addEventListener('click', () => {
                if (!isTransitioning) {
                    cardElement.classList.toggle('is-flipped');
                }
            });

            // --- Logic Swipe ---
            cardElement.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, false);

            cardElement.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleGesture();
            }, false);
            
            return cardElement;
        }
        
        function updateDisplay() {
            counter.textContent = `${currentIndex + 1} / ${totalCards}`;
        }

        function changeCard(newIndex, direction) {
            if (isTransitioning || newIndex === currentIndex) {
                return;
            }

            if (newIndex < 0) {
                newIndex = totalCards - 1;
            } else if (newIndex >= totalCards) {
                newIndex = 0;
            }

            isTransitioning = true;
            const oldCard = document.getElementById('flashcard-' + currentIndex);
            const newCard = renderCard(newIndex);
            
            let slideDirection = direction;
            if (!slideDirection) {
                slideDirection = (newIndex > currentIndex || (currentIndex === totalCards - 1 && newIndex === 0)) ? 'next' : 'prev';
            }
            
            newCard.style.left = slideDirection === 'next' ? '100%' : '-100%';
            flashcardContainer.appendChild(newCard);
            
            if (oldCard) {
                oldCard.classList.add(slideDirection === 'next' ? 'slide-next-out' : 'slide-prev-out');
            }

            setTimeout(() => {
                newCard.style.left = '0';
            }, 50); 

            setTimeout(() => {
                if (oldCard) {
                    oldCard.remove();
                }
                currentIndex = newIndex;
                updateDisplay();
                isTransitioning = false;
            }, 400); 
        }
        
        function goToNextCard() {
            const newIndex = (currentIndex + 1) % totalCards;
            changeCard(newIndex, 'next');
        }

        function goToPrevCard() {
            const newIndex = (currentIndex - 1 + totalCards) % totalCards;
            changeCard(newIndex, 'prev');
        }
        
        function jumpToCard() {
            const inputValue = parseInt(jumpInput.value);
            
            if (isNaN(inputValue) || inputValue < 1 || inputValue > totalCards) {
                alert(`Lỗi: Vui lòng nhập số thẻ hợp lệ từ 1 đến ${totalCards}.`);
                jumpInput.value = "";
                return;
            }
            
            const newIndex = inputValue - 1;

            const direction = (newIndex > currentIndex) ? 'next' : 'prev';
            
            changeCard(newIndex, direction);

            jumpInput.value = "";
        }

        function handleGesture() {
            if (isTransitioning) return;
            const deltaX = touchendX - touchstartX;
            
            if (Math.abs(deltaX) > SWIPE_THRESHOLD) {
                if (deltaX < 0) {
                    goToNextCard();
                } else {
                    goToPrevCard();
                }
            }
        }

        prevBtn.addEventListener('click', goToPrevCard);
        nextBtn.addEventListener('click', goToNextCard);
        jumpBtn.addEventListener('click', jumpToCard);
        
        jumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                jumpToCard();
            }
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            // Dòng code đã được thêm/sửa để hiển thị thẻ đầu tiên
            flashcardContainer.appendChild(renderCard(currentIndex));
            updateDisplay();
        });

    </script>
</body>

</html>
