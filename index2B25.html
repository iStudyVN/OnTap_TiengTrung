<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Tiếng Trung</title>
    <style>
        /* CSS để nhúng font Simsun */
        @font-face {
            font-family: 'Simsun';
            src: url(https://fonts.gstatic.com/s/simsun/v18/K9-BZD0b9T8xcP0Q.woff2) format('woff2');
            unicode-range: U+4E00-9FFF; /* Phạm vi cho ký tự Hán */
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .scene {
            width: 100%;
            height: 300px;
            perspective: 600px;
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            transition: 
                transform 0.6s, 
                opacity 0.3s, 
                left 0.4s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- HIỆU ỨNG TRƯỢT --- */
        .card.slide-next-out {
            transform: translateX(-100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card.slide-prev-out {
            transform: translateX(100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #ffffff;
        }

        /* YÊU CẦU: Mặt trước chữ Hán, font Simsun, màu đen, ở giữa */
        .card__face--front {
            font-family: 'Simsun', sans-serif; 
            font-size: 80px;
            color: #000000; /* Chữ màu đen */
        }

        .card__face--back {
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center; 
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
        }
        
        .back-content p {
            font-size: 1.3rem;
            margin: 8px 0;
            width: 100%;
            text-align: center; 
            font-weight: 500;
        }
        
        .back-content .pinyin { color: #e67e22; font-weight: bold; font-size: 1.6rem; } /* Màu cam */
        .back-content .hanviet { color: #8e44ad; } /* Màu tím */
        .back-content .nghia { color: #1f506b; font-style: italic; } /* Màu xanh đậm (thay vì #27ae60) */
        .back-content .vidu-han { color: #000000; font-family: 'Simsun', sans-serif; margin-top: 15px; font-size: 1.5rem; } /* Chữ Hán đen */
        .back-content .dichnghia { color: #000000; font-style: italic; font-size: 1rem; } /* Chữ đen */


        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-button {
            padding: 10px 20px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 0 5px;
        }

        .nav-button:hover {
            background-color: #2980b9;
        }
        
        #counter {
            font-size: 1.1rem;
            font-weight: bold;
            color: #7f8c8d;
            flex-grow: 1;
            text-align: center;
        }
        
        .jump-control {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        #jump-input {
            width: 60px;
            padding: 8px;
            border: 2px solid #3498db;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
        }
        
        .jump-button {
            background-color: #e74c3c; 
        }
        
        .jump-button:hover {
            background-color: #c0392b;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard Tiếng Trung</h1>
        <div class="scene">
            <div id="flashcard-container"></div>
        </div>
        <div class="navigation">
            <button class="nav-button" id="prev-btn">Trước</button>
            <span id="counter"></span>
            <button class="nav-button" id="next-btn">Sau</button>
        </div>
        
        <div class="jump-control">
            <input type="number" id="jump-input" min="1" max="30" placeholder="#">
            <button class="nav-button jump-button" id="jump-btn">Nhảy đến thẻ số</button>
        </div>
    </div>

    <script>
        // 30 từ vựng Hán ngữ giản thể được lấy từ shengci.txt
        const cardData = [
  { hanzi: '电视台', pinyin: 'diànshìtái', hanviet: 'Điện Thị Đài', nghia: 'Đài truyền hình', vidu: '她是**电视台**的主持人。', dichnghia: 'Cô ấy là người dẫn chương trình của **đài truyền hình**.' },
  { hanzi: '表演', pinyin: 'biǎoyǎn', hanviet: 'Biểu Diễn', nghia: 'Biểu diễn, trình diễn', vidu: '他们正在**表演**一个新节目。', dichnghia: 'Họ đang **biểu diễn** một tiết mục mới.' },
  { hanzi: '节目', pinyin: 'jiémù', hanviet: 'Tiết Mục', nghia: 'Chương trình, tiết mục', vidu: '你喜欢看什么**节目**？', dichnghia: 'Bạn thích xem **chương trình** gì?' },
  { hanzi: '愿意', pinyin: 'yuànyì', hanviet: 'Nguyện Ý', nghia: 'Nguyện ý, bằng lòng', vidu: '你**愿意**帮助我吗？', dichnghia: 'Bạn **bằng lòng** giúp tôi không?' },
  { hanzi: '为什么', pinyin: 'wèishénme', hanviet: 'Vị Thập Ma', nghia: 'Tại sao, vì sao', vidu: '**为什么**他迟到了？', dichnghia: '**Tại sao** anh ấy lại đến muộn?' },
  { hanzi: '得', pinyin: 'de', hanviet: 'Đắc', nghia: '(Trợ từ bổ ngữ trạng thái/mức độ)', vidu: '他跑**得**很快。', dichnghia: 'Anh ấy chạy **rất** nhanh.' },
  { hanzi: '不错', pinyin: 'búcuò', hanviet: 'Bất Thác', nghia: 'Không tồi, khá tốt', vidu: '你的汉语说**得不错**。', dichnghia: 'Tiếng Hán của bạn nói **khá tốt**.' },
  { hanzi: '进步', pinyin: 'jìnbù', hanviet: 'Tiến Bộ', nghia: 'Tiến bộ', vidu: '你的学习有很大**进步**。', dichnghia: 'Việc học của bạn có **tiến bộ** lớn.' },
  { hanzi: '水平', pinyin: 'shuǐpíng', hanviet: 'Thủy Bình', nghia: 'Trình độ, mức độ', vidu: '他的中文**水平**很高。', dichnghia: '**Trình độ** tiếng Trung của anh ấy rất cao.' },
  { hanzi: '提高', pinyin: 'tígāo', hanviet: 'Đề Cao', nghia: 'Nâng cao, cải thiện', vidu: '我们应该**提高**效率。', dichnghia: 'Chúng ta nên **nâng cao** hiệu suất.' },
  { hanzi: '快', pinyin: 'kuài', hanviet: 'Khoái', nghia: 'Nhanh', vidu: '请你走**快**一点。', dichnghia: 'Xin bạn đi **nhanh** một chút.' },
  { hanzi: '哪里', pinyin: 'nǎli', hanviet: 'Na Lí', nghia: 'Đâu, chỗ nào; (Khiêm tốn) đâu có', vidu: '**哪里**，我还需要学习。', dichnghia: '**Đâu có**, tôi vẫn cần phải học hỏi thêm.' },
  { hanzi: '准', pinyin: 'zhǔn', hanviet: 'Chuẩn', nghia: 'Chuẩn xác, chính xác', vidu: '他说**得准**吗？', dichnghia: 'Anh ấy nói có **chính xác** không?' },
  { hanzi: '流利', pinyin: 'liúlì', hanviet: 'Lưu Lợi', nghia: 'Lưu loát', vidu: '她汉语说**得流利**。', dichnghia: 'Cô ấy nói tiếng Hán **lưu loát**.' },
  { hanzi: '努力', pinyin: 'nǔlì', hanviet: 'Nỗ Lực', nghia: 'Cố gắng, nỗ lực', vidu: '他学习很**努力**。', dichnghia: 'Anh ấy học tập rất **cố gắng**.' },
  { hanzi: '认真', pinyin: 'rènzhēn', hanviet: 'Nhận Chân', nghia: 'Nghiêm túc, cẩn thận', vidu: '请**认真**听讲。', dichnghia: 'Xin hãy **nghiêm túc** lắng nghe.' },
  { hanzi: '为', pinyin: 'wèi', hanviet: 'Vị', nghia: 'Vì, cho (mục đích)', vidu: '我们**为**和平而努力。', dichnghia: 'Chúng tôi **vì** hòa bình mà nỗ lực.' },
  { hanzi: '早/晚', pinyin: 'zǎo/wǎn', hanviet: 'Tảo/Vãn', nghia: 'Sớm/Muộn', vidu: '你来**得**太**晚**了。', dichnghia: 'Bạn đến **quá muộn** rồi.' },
  { hanzi: '这么', pinyin: 'zhème', hanviet: 'Giá Ma', nghia: 'Như vậy, đến thế (chỉ mức độ gần)', vidu: '你为什么跑**这么**快？', dichnghia: 'Tại sao bạn chạy **nhanh như vậy**?' },
  { hanzi: '那么', pinyin: 'nàme', hanviet: 'Na Ma', nghia: 'Như thế, đến thế (chỉ mức độ xa)', vidu: '他**那么**高。', dichnghia: 'Anh ấy **cao đến thế**.' },
  { hanzi: '运动', pinyin: 'yùndòng', hanviet: 'Vận Động', nghia: 'Vận động, thể thao', vidu: '我每天都去**运动**。', dichnghia: 'Tôi **vận động** mỗi ngày.' },
  { hanzi: '跑步', pinyin: 'pǎobù', hanviet: 'Pháo Bộ', nghia: 'Chạy bộ', vidu: '她喜欢早上**跑步**。', dichnghia: 'Cô ấy thích **chạy bộ** buổi sáng.' },
  { hanzi: '散步', pinyin: 'sànbù', hanviet: 'Tản Bộ', nghia: 'Đi dạo, tản bộ', vidu: '晚饭后我们去**散步**。', dichnghia: 'Sau bữa tối chúng ta đi **dạo**.' },
  { hanzi: '篮球', pinyin: 'lánqiú', hanviet: 'Lam Cầu', nghia: 'Bóng rổ', vidu: '他很会打**篮球**。', dichnghia: 'Anh ấy chơi **bóng rổ** rất giỏi.' },
  { hanzi: '刚才', pinyin: 'gāngcái', hanviet: 'Cương Tài', nghia: 'Vừa rồi, ban nãy', vidu: '**刚才**你去哪儿了？', dichnghia: '**Ban nãy** bạn đi đâu rồi?' },
  { hanzi: '可以', pinyin: 'kěyǐ', hanviet: 'Khả Dĩ', nghia: 'Có thể, được phép', vidu: '你**可以**用我的笔。', dichnghia: 'Bạn **có thể** dùng bút của tôi.' },
  { hanzi: '坚持', pinyin: 'jiānchí', hanviet: 'Kiên Trì', nghia: 'Kiên trì', vidu: '只要**坚持**，就能成功。', dichnghia: 'Chỉ cần **kiên trì** là có thể thành công.' },
  { hanzi: '因为', pinyin: 'yīnwèi', hanviet: 'Nhân Vị', nghia: 'Bởi vì, do', vidu: '**因为**下雨，所以他没来。', dichnghia: '**Bởi vì** trời mưa nên anh ấy không đến.' },
  { hanzi: '文章', pinyin: 'wénzhāng', hanviet: 'Văn Chương', nghia: 'Bài viết, văn chương', vidu: '这篇**文章**写得很好。', dichnghia: '**Bài viết** này viết rất hay.' },
  { hanzi: '摄影', pinyin: 'shèyǐng', hanviet: 'Nhiếp Ảnh', nghia: 'Nhiếp ảnh, chụp ảnh', vidu: '他对**摄影**很感兴趣。', dichnghia: 'Anh ấy rất hứng thú với **nhiếp ảnh**.' }
];

        const flashcardContainer = document.getElementById('flashcard-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const jumpInput = document.getElementById('jump-input');
        const counter = document.getElementById('counter');

        let currentIndex = 0;
        let isTransitioning = false; 
        const totalCards = cardData.length;
        
        // Biến xử lý Vuốt (Swipe)
        let touchstartX = 0;
        let touchendX = 0;
        const SWIPE_THRESHOLD = 50; 
        
        jumpInput.max = totalCards;
        
        function renderCard(index) {
            const currentCard = cardData[index];
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            cardElement.id = 'flashcard-' + index;

            // Mặt trước: Chữ Hán, Simsun, Đen
            cardElement.innerHTML = `
                <div class="card__face card__face--front">${currentCard.hanzi}</div>
                <div class="card__face card__face--back">
                    <div class="back-content">
                        <p class="pinyin">${currentCard.pinyin}</p>
                        <p class="hanviet">${currentCard.hanviet}</p>
                        <p class="nghia">${currentCard.nghia}</p>
                        <p class="vidu-han">${currentCard.vidu}</p>
                        <p class="dichnghia">${currentCard.dichnghia}</p>
                    </div>
                </div>
            `;
            
            // Xử lý sự kiện lật thẻ
            cardElement.addEventListener('click', () => {
                if (!isTransitioning) {
                    cardElement.classList.toggle('is-flipped');
                }
            });

            // --- Logic Swipe ---
            cardElement.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, false);

            cardElement.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleGesture();
            }, false);
            
            return cardElement;
        }
        
        function updateDisplay() {
            counter.textContent = `${currentIndex + 1} / ${totalCards}`;
        }

        function changeCard(newIndex, direction) {
            if (isTransitioning || newIndex === currentIndex) {
                return;
            }

            if (newIndex < 0) {
                newIndex = totalCards - 1;
            } else if (newIndex >= totalCards) {
                newIndex = 0;
            }

            isTransitioning = true;
            const oldCard = document.getElementById('flashcard-' + currentIndex);
            const newCard = renderCard(newIndex);
            
            let slideDirection = direction;
            if (!slideDirection) {
                slideDirection = (newIndex > currentIndex || (currentIndex === totalCards - 1 && newIndex === 0)) ? 'next' : 'prev';
            }
            
            newCard.style.left = slideDirection === 'next' ? '100%' : '-100%';
            flashcardContainer.appendChild(newCard);
            
            if (oldCard) {
                oldCard.classList.add(slideDirection === 'next' ? 'slide-next-out' : 'slide-prev-out');
            }

            setTimeout(() => {
                newCard.style.left = '0';
            }, 50); 

            setTimeout(() => {
                if (oldCard) {
                    oldCard.remove();
                }
                currentIndex = newIndex;
                updateDisplay();
                isTransitioning = false;
            }, 400); 
        }
        
        function goToNextCard() {
            const newIndex = (currentIndex + 1) % totalCards;
            changeCard(newIndex, 'next');
        }

        function goToPrevCard() {
            const newIndex = (currentIndex - 1 + totalCards) % totalCards;
            changeCard(newIndex, 'prev');
        }
        
        function jumpToCard() {
            const inputValue = parseInt(jumpInput.value);
            
            if (isNaN(inputValue) || inputValue < 1 || inputValue > totalCards) {
                alert(`Lỗi: Vui lòng nhập số thẻ hợp lệ từ 1 đến ${totalCards}.`);
                jumpInput.value = "";
                return;
            }
            
            const newIndex = inputValue - 1;

            const direction = (newIndex > currentIndex) ? 'next' : 'prev';
            
            changeCard(newIndex, direction);

            jumpInput.value = "";
        }

        function handleGesture() {
            if (isTransitioning) return;
            const deltaX = touchendX - touchstartX;
            
            if (Math.abs(deltaX) > SWIPE_THRESHOLD) {
                if (deltaX < 0) {
                    goToNextCard();
                } else {
                    goToPrevCard();
                }
            }
        }

        prevBtn.addEventListener('click', goToPrevCard);
        nextBtn.addEventListener('click', goToNextCard);
        jumpBtn.addEventListener('click', jumpToCard);
        
        jumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                jumpToCard();
            }
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            flashcardContainer.appendChild(renderCard(currentIndex));
            updateDisplay();
        });

    </script>
</body>

</html>
