<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Tiếng Trung</title>
    <style>
        /* CSS để nhúng font Simsun */
        @font-face {
            font-family: 'Simsun';
            src: url(https://fonts.gstatic.com/s/simsun/v18/K9-BZD0b9T8xcP0Q.woff2) format('woff2');
            unicode-range: U+4E00-9FFF; /* Phạm vi cho ký tự Hán */
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .scene {
            width: 100%;
            height: 300px;
            perspective: 600px;
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            transition: 
                transform 0.6s, 
                opacity 0.3s, 
                left 0.4s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- HIỆU ỨNG TRƯỢT --- */
        .card.slide-next-out {
            transform: translateX(-100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card.slide-prev-out {
            transform: translateX(100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #ffffff;
        }

        /* YÊU CẦU: Mặt trước chữ Hán, font Simsun, màu đen, ở giữa */
        .card__face--front {
            font-family: 'Simsun', sans-serif; 
            font-size: 80px;
            color: #000000; /* Chữ màu đen */
        }

        .card__face--back {
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center; 
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
        }
        
        .back-content p {
            font-size: 1.3rem;
            margin: 8px 0;
            width: 100%;
            text-align: center; 
            font-weight: 500;
        }
        
        .back-content .pinyin { color: #e67e22; font-weight: bold; font-size: 1.6rem; } /* Màu cam */
        .back-content .hanviet { color: #8e44ad; } /* Màu tím */
        .back-content .nghia { color: #1f506b; font-style: italic; } /* Màu xanh đậm (thay vì #27ae60) */
        .back-content .vidu-han { color: #000000; font-family: 'Simsun', sans-serif; margin-top: 15px; font-size: 1.5rem; } /* Chữ Hán đen */
        .back-content .dichnghia { color: #000000; font-style: italic; font-size: 1rem; } /* Chữ đen */


        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-button {
            padding: 10px 20px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 0 5px;
        }

        .nav-button:hover {
            background-color: #2980b9;
        }
        
        #counter {
            font-size: 1.1rem;
            font-weight: bold;
            color: #7f8c8d;
            flex-grow: 1;
            text-align: center;
        }
        
        .jump-control {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        #jump-input {
            width: 60px;
            padding: 8px;
            border: 2px solid #3498db;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
        }
        
        .jump-button {
            background-color: #e74c3c; 
        }
        
        .jump-button:hover {
            background-color: #c0392b;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard Tiếng Trung</h1>
        <div class="scene">
            <div id="flashcard-container"></div>
        </div>
        <div class="navigation">
            <button class="nav-button" id="prev-btn">Trước</button>
            <span id="counter"></span>
            <button class="nav-button" id="next-btn">Sau</button>
        </div>
        
        <div class="jump-control">
            <input type="number" id="jump-input" min="1" max="30" placeholder="#">
            <button class="nav-button jump-button" id="jump-btn">Nhảy đến thẻ số</button>
        </div>
    </div>

    <script>
        // 30 từ vựng Hán ngữ giản thể được lấy từ shengci.txt
       const cardData_Dot10 = [
  { hanzi: '会', pinyin: 'huì', hanviet: 'Hội', nghia: 'Biết (kỹ năng), sẽ (khả năng)', vidu: '我会说汉语。', dichnghia: 'Tôi biết nói tiếng Hán.' },
  { hanzi: '打', pinyin: 'dǎ', hanviet: 'Đả', nghia: 'Đánh, chơi (bóng, võ), làm', vidu: '你会打篮球吗？', dichnghia: 'Bạn có biết chơi bóng rổ không?' },
  { hanzi: '太极拳', pinyin: 'tàijíquán', hanviet: 'Thái cực quyền', nghia: 'Thái cực quyền', vidu: '爷爷每天早上打太极拳。', dichnghia: 'Ông nội tập Thái cực quyền mỗi sáng.' },
  { hanzi: '听说', pinyin: 'tīngshuō', hanviet: 'Thính thuyết', nghia: 'Nghe nói', vidu: '听说他要结婚了。', dichnghia: 'Nghe nói anh ấy sắp kết hôn rồi.' },
  { hanzi: '报名', pinyin: 'bàomíng', hanviet: 'Báo danh', nghia: 'Đăng ký, báo danh', vidu: '我想报名参加这个活动。', dichnghia: 'Tôi muốn đăng ký tham gia hoạt động này.' },
  { hanzi: '开始', pinyin: 'kāishǐ', hanviet: 'Khai thủy', nghia: 'Bắt đầu', vidu: '电影九点开始。', dichnghia: 'Bộ phim bắt đầu lúc 9 giờ.' },
  { hanzi: '能', pinyin: 'néng', hanviet: 'Năng', nghia: 'Có thể (khả năng, điều kiện)', vidu: '你能帮我吗？', dichnghia: 'Bạn có thể giúp tôi không?' },
  { hanzi: '再', pinyin: 'zài', hanviet: 'Tái', nghia: 'Lại, nữa', vidu: '请再说一遍。', dichnghia: 'Xin hãy nói lại một lần nữa.' },
  { hanzi: '遍', pinyin: 'biàn', hanviet: 'Biến', nghia: 'Lần (lượng từ cho hành động)', vidu: '我看了这本书一遍。', dichnghia: 'Tôi đã đọc cuốn sách này một lần.' },
  { hanzi: '懂', pinyin: 'dǒng', hanviet: 'Đổng', nghia: 'Hiểu, rõ', vidu: '你听懂了吗？', dichnghia: 'Bạn nghe hiểu chưa?' },
  { hanzi: '舒服', pinyin: 'shūfu', hanviet: 'Thư phục', nghia: 'Dễ chịu, thoải mái, khỏe', vidu: '我今天身体不太舒服。', dichnghia: 'Hôm nay cơ thể tôi không được khỏe lắm.' },
  { hanzi: '意思', pinyin: 'yìsi', hanviet: 'Ý tứ', nghia: 'Ý nghĩa, ý kiến', vidu: '这是什么意思？', dichnghia: 'Cái này có ý nghĩa gì?' },
  { hanzi: '次', pinyin: 'cì', hanviet: 'Thứ', nghia: 'Lần, lượt', vidu: '我去过一次北京。', dichnghia: 'Tôi đã đi Bắc Kinh một lần.' },
  { hanzi: '小时', pinyin: 'xiǎoshí', hanviet: 'Tiểu thời', nghia: 'Giờ (khoảng thời gian)', vidu: '他学习了三个小时。', dichnghia: 'Anh ấy đã học được ba giờ.' },
  { hanzi: '请假', pinyin: 'qǐng jià', hanviet: 'Thỉnh giả', nghia: 'Xin nghỉ phép', vidu: '我生病了，想请假。', dichnghia: 'Tôi bị ốm rồi, muốn xin nghỉ phép.' },
  { hanzi: '头疼', pinyin: 'tóuténg', hanviet: 'Đầu đông', nghia: 'Đau đầu', vidu: '我有点头疼。', dichnghia: 'Tôi hơi bị đau đầu.' },
  { hanzi: '发烧', pinyin: 'fāshāo', hanviet: 'Phát thiêu', nghia: 'Sốt', vidu: '孩子发烧了。', dichnghia: 'Đứa trẻ bị sốt rồi.' },
  { hanzi: '可能', pinyin: 'kěnéng', hanviet: 'Khả năng', nghia: 'Có thể, có lẽ', vidu: '他可能不会来了。', dichnghia: 'Anh ấy có thể sẽ không đến nữa.' },
  { hanzi: '咳嗽', pinyin: 'késou', hanviet: 'Khái thấu', nghia: 'Ho', vidu: '她咳嗽得很厉害。', dichnghia: 'Cô ấy ho rất dữ dội.' },
  { hanzi: '感冒', pinyin: 'gǎnmào', hanviet: 'Cảm mạo', nghia: 'Cảm, cảm lạnh', vidu: '我感冒了。', dichnghia: 'Tôi bị cảm rồi.' },
  { hanzi: '看病', pinyin: 'kàn bìng', hanviet: 'Khán bệnh', nghia: 'Khám bệnh', vidu: '妈妈带我去医院看病。', dichnghia: 'Mẹ dẫn tôi đến bệnh viện khám bệnh.' },
  { hanzi: '游泳', pinyin: 'yóuyǒng', hanviet: 'Du vịnh', nghia: 'Bơi lội', vidu: '夏天去游泳很舒服。', dichnghia: 'Mùa hè đi bơi rất dễ chịu.' },
  { hanzi: '停车', pinyin: 'tíng chē', hanviet: 'Đình xa', nghia: 'Đỗ xe, dừng xe', vidu: '这里不能停车。', dichnghia: 'Ở đây không được đỗ xe.' },
  { hanzi: '钓鱼', pinyin: 'diàoyú', hanviet: 'Điếu ngư', nghia: 'Câu cá', vidu: '爸爸喜欢去河边钓鱼。', dichnghia: 'Bố thích ra bờ sông câu cá.' },
  { hanzi: '滑冰', pinyin: 'huábīng', hanviet: 'Hoạt băng', nghia: 'Trượt băng', vidu: '我们去滑冰场滑冰。', dichnghia: 'Chúng ta đi sân trượt băng để trượt băng.' },
  { hanzi: '拍照', pinyin: 'pāizhào', hanviet: 'Phách chiếu', nghia: 'Chụp ảnh', vidu: '我们可以合影拍照吗？', dichnghia: 'Chúng ta có thể chụp ảnh chung không?' },
  { hanzi: '抽/吸烟', pinyin: 'chōu/xī yān', hanviet: 'Trừu/Hấp yên', nghia: 'Hút thuốc', vidu: '医院里禁止吸烟。', dichnghia: 'Trong bệnh viện cấm hút thuốc.' },
  { hanzi: '唱歌', pinyin: 'chàng gē', hanviet: 'Xướng ca', nghia: 'Hát', vidu: '我们去KTV唱歌。', dichnghia: 'Chúng ta đi KTV hát.' },
  { hanzi: '跳舞', pinyin: 'tiàowǔ', hanviet: 'Khiêu vũ', nghia: 'Nhảy múa, khiêu vũ', vidu: '她跳舞跳得很好。', dichnghia: 'Cô ấy nhảy rất đẹp.' }
];
        const flashcardContainer = document.getElementById('flashcard-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const jumpInput = document.getElementById('jump-input');
        const counter = document.getElementById('counter');

        let currentIndex = 0;
        let isTransitioning = false; 
        const totalCards = cardData.length;
        
        // Biến xử lý Vuốt (Swipe)
        let touchstartX = 0;
        let touchendX = 0;
        const SWIPE_THRESHOLD = 50; 
        
        jumpInput.max = totalCards;
        
        function renderCard(index) {
            const currentCard = cardData[index];
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            cardElement.id = 'flashcard-' + index;

            // Mặt trước: Chữ Hán, Simsun, Đen
            cardElement.innerHTML = `
                <div class="card__face card__face--front">${currentCard.hanzi}</div>
                <div class="card__face card__face--back">
                    <div class="back-content">
                        <p class="pinyin">${currentCard.pinyin}</p>
                        <p class="hanviet">${currentCard.hanviet}</p>
                        <p class="nghia">${currentCard.nghia}</p>
                        <p class="vidu-han">${currentCard.vidu}</p>
                        <p class="dichnghia">${currentCard.dichnghia}</p>
                    </div>
                </div>
            `;
            
            // Xử lý sự kiện lật thẻ
            cardElement.addEventListener('click', () => {
                if (!isTransitioning) {
                    cardElement.classList.toggle('is-flipped');
                }
            });

            // --- Logic Swipe ---
            cardElement.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, false);

            cardElement.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleGesture();
            }, false);
            
            return cardElement;
        }
        
        function updateDisplay() {
            counter.textContent = `${currentIndex + 1} / ${totalCards}`;
        }

        function changeCard(newIndex, direction) {
            if (isTransitioning || newIndex === currentIndex) {
                return;
            }

            if (newIndex < 0) {
                newIndex = totalCards - 1;
            } else if (newIndex >= totalCards) {
                newIndex = 0;
            }

            isTransitioning = true;
            const oldCard = document.getElementById('flashcard-' + currentIndex);
            const newCard = renderCard(newIndex);
            
            let slideDirection = direction;
            if (!slideDirection) {
                slideDirection = (newIndex > currentIndex || (currentIndex === totalCards - 1 && newIndex === 0)) ? 'next' : 'prev';
            }
            
            newCard.style.left = slideDirection === 'next' ? '100%' : '-100%';
            flashcardContainer.appendChild(newCard);
            
            if (oldCard) {
                oldCard.classList.add(slideDirection === 'next' ? 'slide-next-out' : 'slide-prev-out');
            }

            setTimeout(() => {
                newCard.style.left = '0';
            }, 50); 

            setTimeout(() => {
                if (oldCard) {
                    oldCard.remove();
                }
                currentIndex = newIndex;
                updateDisplay();
                isTransitioning = false;
            }, 400); 
        }
        
        function goToNextCard() {
            const newIndex = (currentIndex + 1) % totalCards;
            changeCard(newIndex, 'next');
        }

        function goToPrevCard() {
            const newIndex = (currentIndex - 1 + totalCards) % totalCards;
            changeCard(newIndex, 'prev');
        }
        
        function jumpToCard() {
            const inputValue = parseInt(jumpInput.value);
            
            if (isNaN(inputValue) || inputValue < 1 || inputValue > totalCards) {
                alert(`Lỗi: Vui lòng nhập số thẻ hợp lệ từ 1 đến ${totalCards}.`);
                jumpInput.value = "";
                return;
            }
            
            const newIndex = inputValue - 1;

            const direction = (newIndex > currentIndex) ? 'next' : 'prev';
            
            changeCard(newIndex, direction);

            jumpInput.value = "";
        }

        function handleGesture() {
            if (isTransitioning) return;
            const deltaX = touchendX - touchstartX;
            
            if (Math.abs(deltaX) > SWIPE_THRESHOLD) {
                if (deltaX < 0) {
                    goToNextCard();
                } else {
                    goToPrevCard();
                }
            }
        }

        prevBtn.addEventListener('click', goToPrevCard);
        nextBtn.addEventListener('click', goToNextCard);
        jumpBtn.addEventListener('click', jumpToCard);
        
        jumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                jumpToCard();
            }
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            flashcardContainer.appendChild(renderCard(currentIndex));
            updateDisplay();
        });

    </script>
</body>

</html>
