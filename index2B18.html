<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Tiếng Trung</title>
    <style>
        /* CSS để nhúng font Simsun */
        @font-face {
            font-family: 'Simsun';
            src: url(https://fonts.gstatic.com/s/simsun/v18/K9-BZD0b9T8xcP0Q.woff2) format('woff2');
            unicode-range: U+4E00-9FFF; /* Phạm vi cho ký tự Hán */
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .scene {
            width: 100%;
            height: 300px;
            perspective: 600px;
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            transition: 
                transform 0.6s, 
                opacity 0.3s, 
                left 0.4s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- HIỆU ỨNG TRƯỢT --- */
        .card.slide-next-out {
            transform: translateX(-100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card.slide-prev-out {
            transform: translateX(100%) rotateY(0deg); 
            opacity: 0;
            pointer-events: none;
        }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #ffffff;
        }

        /* YÊU CẦU: Mặt trước chữ Hán, font Simsun, màu đen, ở giữa */
        .card__face--front {
            font-family: 'Simsun', sans-serif; 
            font-size: 80px;
            color: #000000; /* Chữ màu đen */
        }

        .card__face--back {
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center; 
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
        }
        
        .back-content p {
            font-size: 1.3rem;
            margin: 8px 0;
            width: 100%;
            text-align: center; 
            font-weight: 500;
        }
        
        .back-content .pinyin { color: #e67e22; font-weight: bold; font-size: 1.6rem; } /* Màu cam */
        .back-content .hanviet { color: #8e44ad; } /* Màu tím */
        .back-content .nghia { color: #1f506b; font-style: italic; } /* Màu xanh đậm (thay vì #27ae60) */
        .back-content .vidu-han { color: #000000; font-family: 'Simsun', sans-serif; margin-top: 15px; font-size: 1.5rem; } /* Chữ Hán đen */
        .back-content .dichnghia { color: #000000; font-style: italic; font-size: 1rem; } /* Chữ đen */


        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-button {
            padding: 10px 20px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 0 5px;
        }

        .nav-button:hover {
            background-color: #2980b9;
        }
        
        #counter {
            font-size: 1.1rem;
            font-weight: bold;
            color: #7f8c8d;
            flex-grow: 1;
            text-align: center;
        }
        
        .jump-control {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        #jump-input {
            width: 60px;
            padding: 8px;
            border: 2px solid #3498db;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
        }
        
        .jump-button {
            background-color: #e74c3c; 
        }
        
        .jump-button:hover {
            background-color: #c0392b;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard Tiếng Trung</h1>
        <div class="scene">
            <div id="flashcard-container"></div>
        </div>
        <div class="navigation">
            <button class="nav-button" id="prev-btn">Trước</button>
            <span id="counter"></span>
            <button class="nav-button" id="next-btn">Sau</button>
        </div>
        
        <div class="jump-control">
            <input type="number" id="jump-input" min="1" max="30" placeholder="#">
            <button class="nav-button jump-button" id="jump-btn">Nhảy đến thẻ số</button>
        </div>
    </div>

    <script>
        // 30 từ vựng Hán ngữ giản thể được lấy từ shengci.txt
       const cardData = [
  { hanzi: '包里', pinyin: 'bāolǐ', hanviet: 'Bao lí', nghia: 'Trong túi, trong cặp', vidu: '我的手机在包里。', dichnghia: 'Điện thoại của tôi ở trong túi.' },
  { hanzi: '顺便', pinyin: 'shùnbiàn', hanviet: 'Thuận tiện', nghia: 'Nhân tiện, tiện thể', vidu: '你去银行顺便帮我取钱。', dichnghia: 'Bạn đến ngân hàng nhân tiện rút tiền giúp tôi.' },
  { hanzi: '办', pinyin: 'bàn', hanviet: 'Biện', nghia: 'Làm, xử lý, giải quyết', vidu: '我需要办签证。', dichnghia: 'Tôi cần làm (xin) visa.' },
  { hanzi: '身份证', pinyin: 'shēnfènzhèng', hanviet: 'Thân phận chứng', nghia: 'Chứng minh nhân dân/Thẻ căn cước', vidu: '请出示你的身份证。', dichnghia: 'Xin hãy xuất trình Chứng minh nhân dân của bạn.' },
  { hanzi: '护照', pinyin: 'hùzhào', hanviet: 'Hộ chiếu', nghia: 'Hộ chiếu', vidu: '出国需要带护照。', dichnghia: 'Ra nước ngoài cần mang theo hộ chiếu.' },
  { hanzi: '签证', pinyin: 'qiānzhèng', hanviet: 'Thiên chứng', nghia: 'Visa, thị thực', vidu: '你办好签证了吗？', dichnghia: 'Bạn đã làm xong visa chưa?' },
  { hanzi: '替', pinyin: 'tì', hanviet: 'Thế', nghia: 'Thay, thay thế, vì (ai đó)', vidu: '他替我写了信。', dichnghia: 'Anh ấy đã viết thư thay tôi.' },
  { hanzi: '帮', pinyin: 'bāng', hanviet: 'Bang', nghia: 'Giúp đỡ', vidu: '你能帮我一个忙吗？', dichnghia: 'Bạn có thể giúp tôi một việc được không?' },
  { hanzi: '报告', pinyin: 'bàogào', hanviet: 'Báo cáo', nghia: 'Báo cáo, bản báo cáo', vidu: '这份报告很重要。', dichnghia: 'Bản báo cáo này rất quan trọng.' },
  { hanzi: '青年', pinyin: 'qīngnián', hanviet: 'Thanh niên', nghia: 'Thanh niên, giới trẻ', vidu: '他们都是青年教师。', dichnghia: 'Họ đều là giáo viên trẻ (thanh niên).' },
  { hanzi: '报纸', pinyin: 'bàozhǐ', hanviet: 'Báo chỉ', nghia: 'Báo, tờ báo', vidu: '爷爷每天都看报纸。', dichnghia: 'Ông nội xem báo mỗi ngày.' },
  { hanzi: '旅行', pinyin: 'lǚxíng', hanviet: 'Lữ hành', nghia: 'Du lịch, đi du lịch', vidu: '我们计划去北京旅行。', dichnghia: 'Chúng tôi lên kế hoạch đi Bắc Kinh du lịch.' },
  { hanzi: '旅游', pinyin: 'lǚyóu', hanviet: 'Lữ du', nghia: 'Du lịch', vidu: '旅游可以让人放松。', dichnghia: 'Du lịch có thể giúp con người thư giãn.' },
  { hanzi: '邮票', pinyin: 'yóupiào', hanviet: 'Bưu phiếu', nghia: 'Tem thư', vidu: '我喜欢收集邮票。', dichnghia: 'Tôi thích sưu tập tem thư.' },
  { hanzi: '门票', pinyin: 'ménpiào', hanviet: 'Môn phiếu', nghia: 'Vé vào cửa', vidu: '这张门票多少钱？', dichnghia: 'Tấm vé vào cửa này bao nhiêu tiền?' },
  { hanzi: '电影票', pinyin: 'diànyǐngpiào', hanviet: 'Điện ảnh phiếu', nghia: 'Vé xem phim', vidu: '我买了周末的电影票。', dichnghia: 'Tôi đã mua vé xem phim cuối tuần.' },
  { hanzi: '车票', pinyin: 'chēpiào', hanviet: 'Xa phiếu', nghia: 'Vé xe, vé tàu xe', vidu: '请把车票给我看一下。', dichnghia: 'Xin hãy cho tôi xem vé xe một chút.' },
  { hanzi: '停车票', pinyin: 'tíngchēpiào', hanviet: 'Đình xa phiếu', nghia: 'Vé đậu xe, vé gửi xe', vidu: '你拿好停车票了吗？', dichnghia: 'Bạn đã giữ kỹ vé gửi xe chưa?' },
  { hanzi: '火车票', pinyin: 'huǒchēpiào', hanviet: 'Hỏa xa phiếu', nghia: 'Vé xe lửa, vé tàu hỏa', vidu: '我需要订一张火车票。', dichnghia: 'Tôi cần đặt một tấm vé tàu hỏa.' },
  { hanzi: '机票', pinyin: 'jīpiào', hanviet: 'Cơ phiếu', nghia: 'Vé máy bay', vidu: '机票价格很贵。', dichnghia: 'Giá vé máy bay rất đắt.' },
  { hanzi: '拿', pinyin: 'ná', hanviet: 'Nã', nghia: 'Cầm, lấy, mang', vidu: '请帮我拿一下包。', dichnghia: 'Xin hãy giúp tôi cầm cái túi một chút.' },
  { hanzi: '开玩笑', pinyin: 'kāi wánxiào', hanviet: 'Khai ngoạn tiếu', nghia: 'Nói đùa, đùa giỡn', vidu: '我只是开玩笑，你别生气。', dichnghia: 'Tôi chỉ nói đùa thôi, bạn đừng giận.' },
  { hanzi: '用', pinyin: 'yòng', hanviet: 'Dụng', nghia: 'Dùng, sử dụng, cần', vidu: '你用这个笔吗？', dichnghia: 'Bạn dùng cái bút này không?' },
  { hanzi: '使用', pinyin: 'shǐyòng', hanviet: 'Sử dụng', nghia: 'Sử dụng, dùng', vidu: '请正确使用机器。', dichnghia: 'Xin hãy sử dụng máy móc một cách chính xác.' },
  { hanzi: '不用', pinyin: 'búyòng', hanviet: 'Bất dụng', nghia: 'Không cần, không cần dùng', vidu: '谢谢你，不用了。', dichnghia: 'Cảm ơn bạn, không cần đâu.' },
  { hanzi: '代表团', pinyin: 'dàibiǎotuán', hanviet: 'Đại biểu đoàn', nghia: 'Đoàn đại biểu', vidu: '欢迎外国代表团。', dichnghia: 'Chào mừng đoàn đại biểu nước ngoài.' },
  { hanzi: '参观', pinyin: 'cānguān', hanviet: 'Tham quan', nghia: 'Tham quan', vidu: '我们去参观博物馆。', dichnghia: 'Chúng tôi đi tham quan bảo tàng.' },
  { hanzi: '当', pinyin: 'dāng', hanviet: 'Đương', nghia: 'Làm, trở thành, đảm nhận', vidu: '她想当一名教师。', dichnghia: 'Cô ấy muốn làm một giáo viên.' },
  { hanzi: '翻译', pinyin: 'fānyì', hanviet: 'Phiên dịch', nghia: 'Phiên dịch, người phiên dịch', vidu: '他是一名专业的翻译。', dichnghia: 'Anh ấy là một phiên dịch viên chuyên nghiệp.' },
  { hanzi: '外贸', pinyin: 'wàimào', hanviet: 'Ngoại mậu', nghia: 'Ngoại thương', vidu: '他在一家外贸公司工作。', dichnghia: 'Anh ấy làm việc tại một công ty ngoại thương.' },
  { hanzi: '汉化', pinyin: 'hànhuà', hanviet: 'Hán hóa', nghia: 'Hán hóa, bản địa hóa (phần mềm, game)', vidu: '这个游戏有中文汉化版。', dichnghia: 'Trò chơi này có bản Hán hóa tiếng Trung.' },
  { hanzi: '小时', pinyin: 'xiǎoshí', hanviet: 'Tiểu thời', nghia: 'Giờ, tiếng đồng hồ', vidu: '我们等了两个小时。', dichnghia: 'Chúng tôi đã đợi hai tiếng đồng hồ.' },
  { hanzi: '多长时间', pinyin: 'duō cháng shíjiān', hanviet: 'Đa trường thời gian', nghia: 'Bao lâu (thời gian)', vidu: '你学习中文多长时间了？', dichnghia: 'Bạn học tiếng Trung được bao lâu rồi?' }
];

        const flashcardContainer = document.getElementById('flashcard-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const jumpInput = document.getElementById('jump-input');
        const counter = document.getElementById('counter');

        let currentIndex = 0;
        let isTransitioning = false; 
        const totalCards = cardData.length;
        
        // Biến xử lý Vuốt (Swipe)
        let touchstartX = 0;
        let touchendX = 0;
        const SWIPE_THRESHOLD = 50; 
        
        jumpInput.max = totalCards;
        
        function renderCard(index) {
            const currentCard = cardData[index];
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            cardElement.id = 'flashcard-' + index;

            // Mặt trước: Chữ Hán, Simsun, Đen
            cardElement.innerHTML = `
                <div class="card__face card__face--front">${currentCard.hanzi}</div>
                <div class="card__face card__face--back">
                    <div class="back-content">
                        <p class="pinyin">${currentCard.pinyin}</p>
                        <p class="hanviet">${currentCard.hanviet}</p>
                        <p class="nghia">${currentCard.nghia}</p>
                        <p class="vidu-han">${currentCard.vidu}</p>
                        <p class="dichnghia">${currentCard.dichnghia}</p>
                    </div>
                </div>
            `;
            
            // Xử lý sự kiện lật thẻ
            cardElement.addEventListener('click', () => {
                if (!isTransitioning) {
                    cardElement.classList.toggle('is-flipped');
                }
            });

            // --- Logic Swipe ---
            cardElement.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, false);

            cardElement.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleGesture();
            }, false);
            
            return cardElement;
        }
        
        function updateDisplay() {
            counter.textContent = `${currentIndex + 1} / ${totalCards}`;
        }

        function changeCard(newIndex, direction) {
            if (isTransitioning || newIndex === currentIndex) {
                return;
            }

            if (newIndex < 0) {
                newIndex = totalCards - 1;
            } else if (newIndex >= totalCards) {
                newIndex = 0;
            }

            isTransitioning = true;
            const oldCard = document.getElementById('flashcard-' + currentIndex);
            const newCard = renderCard(newIndex);
            
            let slideDirection = direction;
            if (!slideDirection) {
                slideDirection = (newIndex > currentIndex || (currentIndex === totalCards - 1 && newIndex === 0)) ? 'next' : 'prev';
            }
            
            newCard.style.left = slideDirection === 'next' ? '100%' : '-100%';
            flashcardContainer.appendChild(newCard);
            
            if (oldCard) {
                oldCard.classList.add(slideDirection === 'next' ? 'slide-next-out' : 'slide-prev-out');
            }

            setTimeout(() => {
                newCard.style.left = '0';
            }, 50); 

            setTimeout(() => {
                if (oldCard) {
                    oldCard.remove();
                }
                currentIndex = newIndex;
                updateDisplay();
                isTransitioning = false;
            }, 400); 
        }
        
        function goToNextCard() {
            const newIndex = (currentIndex + 1) % totalCards;
            changeCard(newIndex, 'next');
        }

        function goToPrevCard() {
            const newIndex = (currentIndex - 1 + totalCards) % totalCards;
            changeCard(newIndex, 'prev');
        }
        
        function jumpToCard() {
            const inputValue = parseInt(jumpInput.value);
            
            if (isNaN(inputValue) || inputValue < 1 || inputValue > totalCards) {
                alert(`Lỗi: Vui lòng nhập số thẻ hợp lệ từ 1 đến ${totalCards}.`);
                jumpInput.value = "";
                return;
            }
            
            const newIndex = inputValue - 1;

            const direction = (newIndex > currentIndex) ? 'next' : 'prev';
            
            changeCard(newIndex, direction);

            jumpInput.value = "";
        }

        function handleGesture() {
            if (isTransitioning) return;
            const deltaX = touchendX - touchstartX;
            
            if (Math.abs(deltaX) > SWIPE_THRESHOLD) {
                if (deltaX < 0) {
                    goToNextCard();
                } else {
                    goToPrevCard();
                }
            }
        }

        prevBtn.addEventListener('click', goToPrevCard);
        nextBtn.addEventListener('click', goToNextCard);
        jumpBtn.addEventListener('click', jumpToCard);
        
        jumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                jumpToCard();
            }
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            flashcardContainer.appendChild(renderCard(currentIndex));
            updateDisplay();
        });

    </script>
</body>

</html>
